name: Sync pledge numbers from Databricks

on:
  schedule:
    # 07:00 UTC = 1:00 AM Mountain during MDT (summer). GitHub cron is UTC-only
    # and does not follow DST, so in MST (winter) this fires at 12:00 AM MT.
    # If you want a hard 1:00 AM MT year-round, switch to "0 8 * * *" in winter.
    - cron: '0 7 * * *'
  workflow_dispatch:

# Reads + writes the repo (to commit the refreshed JSON) and deploys Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Share the "pages" concurrency group with deploy.yml so the two never collide.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Interim: builds pledge.json from the deterministic ledger (no secrets
      # needed). When Databricks is wired, set PLEDGE_SOURCE=databricks and add
      # the three DATABRICKS_* secrets below.
      - name: Sync pledge.json
        env:
          PLEDGE_SOURCE: ledger
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: node scripts/sync-pledge.mjs

      - name: Commit refreshed numbers (if changed)
        run: |
          if git diff --quiet -- public/data/pledge.json; then
            echo "No change in public/data/pledge.json"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/pledge.json
            git commit -m "chore(pledge): daily Databricks sync"
            git push
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
