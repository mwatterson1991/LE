<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A license is not adoption</title>
<style>
@font-face{font-family:'Season';src:url(../../../fonts/SeasonMix-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Book.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Medium.woff2) format('woff2');font-weight:500}
:root{--blue:#80ACED;--slate:#869AA6;--beige:#F3F1E6;--paper:#F9F8F3;--ink:#010101;--neutral:#222}
html,body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#010101;font-family:'Macan',sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
.h{position:absolute;margin:0;font:500 70px/1.04 'Season',Georgia,serif;letter-spacing:-.022em;color:#fff;left:80px;top:80px;width:500px}
.h em{font-style:normal;color:#80ACED}
.logo{position:absolute;left:80px;bottom:64px;width:66px}
svg{position:absolute;left:0;top:0;overflow:visible}
svg text{font-family:'Macan',sans-serif}
.pre{position:absolute;left:-9999px;top:0;opacity:0}

</style></head><body>
<div class="stage">
  <h1 class="h">A license is not <em>adoption</em>.</h1>
  <img class="logo" src="../../brand/logo-white.svg" alt="">
  <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
  <div class="pre"><span style="font:500 20px Season">a</span><span style="font:400 20px Macan">a</span><span style="font:500 20px Macan">a</span></div>
  
</div>
<script>
const D=9; window.DURATION=D;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), seg=(t,a,b)=>clamp((t-a)/(b-a),0,1), lerp=(a,b,k)=>a+(b-a)*k;
const E={io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, out:x=>1-Math.pow(1-x,3), in:x=>x*x*x, lin:x=>x};
const svg=document.getElementById('svg');
const NS='http://www.w3.org/2000/svg';
const S=(el,a)=>{for(const k in a)el.setAttribute(k,a[k]);return el};
const mk=(tag,a,p)=>{const e=document.createElementNS(NS,tag);S(e,a||{});(p||svg).appendChild(e);return e};
const txt=(x,y,s,a,p)=>{const e=mk('text',Object.assign({x,y},a||{}),p);e.textContent=s;return e};
let _s=11; const rnd=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff};
const INK='#010101', WHITE='#fff', BLUE='#80ACED', FOLLOW=BLUE, SLATE='#869AA6', BEIGE='#F3F1E6', PAPER='#F9F8F3';

// A building: every window has a seat licensed; only one light is on. Enablement reaches it floor by floor.
const BX=620,BY=96,BW=580,BH=560, COLS=9, ROWS=9, WW=44, WH=40;
const gx=(BW-24-COLS*WW)/(COLS-1), gy=(BH-24-ROWS*WH)/(ROWS-1);
mk('rect',{x:BX,y:BY,width:BW,height:BH,fill:'none',stroke:'#3a3a3a','stroke-width':2});
mk('line',{x1:560,y1:BY+BH,x2:1240,y2:BY+BH,stroke:'#3a3a3a','stroke-width':2});
for(let r=1;r<ROWS;r++){const y=BY+12+r*(WH+gy)-gy/2; mk('line',{x1:BX,y1:y,x2:BX+BW,y2:y,stroke:'#262626','stroke-width':1});}
const win=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const x=BX+12+c*(WW+gx), y=BY+12+(ROWS-1-r)*(WH+gy);
  const dark=mk('rect',{x,y,width:WW,height:WH,fill:'#1a1a1a'});
  const lit=mk('rect',{x,y,width:WW,height:WH,fill:WHITE,opacity:0});
  win.push({r,c,lit,order:rnd()});
}
const FIRST=win.find(w=>w.r===3&&w.c===4);
const T0=1.3, PER=.42, FADE=.34;
function render(t){
  const off=E.in(seg(t,7.6,8.3)); // everything but the first light goes dark at the end
  for(const w of win){
    const on=E.out(seg(t,T0+w.r*PER+w.order*.22,T0+w.r*PER+w.order*.22+FADE));
    let o=on*(1-off);
    if(w===FIRST) o=1;
    w.lit.setAttribute('opacity',o);
  }
}

window.seek=t=>render(((t%D)+D)%D);
render(0);
if(location.hash==='#play'){(function loop(){render((performance.now()/1000)%D);requestAnimationFrame(loop)})();}
</script></body></html>
