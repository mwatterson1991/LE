<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AI employee</title>
<style>
@font-face{font-family:'Season';src:url(../../../fonts/SeasonMix-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Book.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-SemiBold.woff2) format('woff2');font-weight:600}
:root{--ink:#111;--ink2:#4c4c4c;--ink3:#767676;--g2:#eee;--blue:#2f5fd6;--sky:#80aced}
html,body{margin:0;background:#fff}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#fff;font-family:'Macan',sans-serif;-webkit-font-smoothing:antialiased}
h1{position:absolute;left:80px;top:72px;margin:0;font-family:'Season',serif;font-weight:500;font-size:56px;line-height:1.08;letter-spacing:-.01em;color:var(--ink);max-width:800px}
h1 b{font-weight:500;color:var(--blue)}
.mark{position:absolute;right:80px;bottom:60px;width:30px}
svg{position:absolute;left:0;top:0}
.nl{font-family:'Macan',sans-serif;font-weight:500;font-size:20px;fill:#111}
.ri{font-family:'Macan',sans-serif;font-weight:600;font-size:13px;letter-spacing:.12em;fill:#767676}
</style></head><body>
<div class="stage">
  <h1>An agent that <b>owns the job.</b></h1>
  <svg id="s" width="1280" height="720" viewBox="0 0 1280 720" fill="none" stroke-linecap="round" stroke-linejoin="round"></svg>
  <img class="mark" src="../../logomark.png" alt="">
</div>
<script>
const D=8; window.DURATION=D;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(a,b,k)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')';};
const L=230,Rr=1000,T=330,B=596,NR=32;
const NODES=[{x:L,y:T,n:'Trigger',pos:'above'},{x:Rr,y:T,n:'Research',pos:'above'},{x:Rr,y:B,n:'Draft',pos:'below'},{x:L,y:B,n:'Deliver',pos:'below'}];
const ICON=[
 `<circle r="11"/><path d="M0 -6 V0 L4 3"/>`,                                   // clock
 `<circle cx="-2" cy="-2" r="9"/><path d="M5 5 L12 12"/>`,                     // magnifier
 `<path d="M-9 -12 H9 V12 H-9 Z"/><path d="M-4 -4 H4 M-4 2 H4 M-4 8 H0"/>`,     // draft page
 `<path d="M-12 -2 L12 -10 L4 12 L0 2 Z"/><path d="M0 2 L12 -10"/>`            // paper plane
];
const svg=document.getElementById('s');
const loopPath=`M${L} ${T} H${Rr} V${B} H${L} Z`;
let html=`<path id="lp" d="${loopPath}" stroke="#eee" stroke-width="2"/>`;
// direction chevrons at edge midpoints
const mx=(L+Rr)/2,my=(T+B)/2;
html+=`<g stroke="#767676" stroke-width="2"><path d="M${mx-5} ${T-6} L${mx+1} ${T} L${mx-5} ${T+6}"/><path d="M${Rr-6} ${my-5} L${Rr} ${my+1} L${Rr+6} ${my-5}"/><path d="M${mx+5} ${B-6} L${mx-1} ${B} L${mx+5} ${B+6}"/><path d="M${L-6} ${my+5} L${L} ${my-1} L${L+6} ${my+5}"/></g>`;
NODES.forEach((n,i)=>{
  html+=`<circle id="halo${i}" cx="${n.x}" cy="${n.y}" r="${NR}" fill="#80aced" opacity="0"/>`;
  html+=`<circle id="node${i}" cx="${n.x}" cy="${n.y}" r="${NR}" fill="#fff" stroke="#111" stroke-width="2"/>`;
  html+=`<g id="ic${i}" transform="translate(${n.x} ${n.y})" stroke="#111" stroke-width="2">${ICON[i]}</g>`;
  const ly=n.pos==='above'?n.y-NR-22:n.y+NR+34;
  html+=`<text class="nl" x="${n.x}" y="${ly}" text-anchor="middle">${n.n}</text>`;
});
html+=`<g transform="translate(${mx} ${my})"><g id="ri" stroke="#767676" stroke-width="1.8" transform="translate(-62 0)"><path d="M-8 -2 A8 8 0 0 1 7 -5"/><path d="M7 -9 V-5 H3"/><path d="M8 2 A8 8 0 0 1 -7 5"/><path d="M-7 9 V5 H-3"/></g><text class="ri" x="12" y="5" text-anchor="middle">RUNS ITSELF</text></g>`;
html+=`<circle id="trail" r="14" fill="#80aced" opacity=".35"/><circle id="dot" r="8" fill="#2f5fd6"/>`;
svg.innerHTML=html;
const lp=document.getElementById('lp'),dot=document.getElementById('dot'),trail=document.getElementById('trail');
const LEN=lp.getTotalLength();
const nodeLen=[0,Rr-L,(Rr-L)+(B-T),2*(Rr-L)+(B-T)];
function render(t){
  const s=(t/D)*LEN; const p=lp.getPointAtLength(s);
  dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);trail.setAttribute('cx',p.x);trail.setAttribute('cy',p.y);
  let near=Infinity; nodeLen.forEach(nl=>{let d=Math.abs(s-nl); d=Math.min(d,LEN-d); near=Math.min(near,d);});
  const vis=clamp((near-(NR-10))/14,0,1); dot.setAttribute('opacity',vis); trail.setAttribute('opacity',0.35*vis);
  NODES.forEach((n,i)=>{
    let d=Math.abs(s-nodeLen[i]); d=Math.min(d,LEN-d);
    const k=clamp(1-d/90,0,1);
    document.getElementById('node'+i).setAttribute('stroke',mix('#111111','#2f5fd6',k));
    document.getElementById('ic'+i).setAttribute('stroke',mix('#111111','#2f5fd6',k));
    const h=document.getElementById('halo'+i); h.setAttribute('r',NR+16*k); h.setAttribute('opacity',0.45*k);
  });
}
let auto=true; window.seek=t=>{auto=false;render(((t%D)+D)%D)};
(function loop(){if(auto)render((performance.now()/1000)%D);requestAnimationFrame(loop)})();
</script></body></html>
