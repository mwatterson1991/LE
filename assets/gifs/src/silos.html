<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>One system, not two silos</title>
<style>
@font-face{font-family:'Season';src:url(../../../fonts/SeasonMix-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Book.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Medium.woff2) format('woff2');font-weight:500}
:root{--blue:#80ACED;--slate:#869AA6;--beige:#F3F1E6;--paper:#F9F8F3;--ink:#010101;--neutral:#222}
html,body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#FFFFFF;font-family:'Macan',sans-serif;-webkit-font-smoothing:antialiased;color:#010101}
.h{position:absolute;margin:0;font:500 66px/1.04 'Season',Georgia,serif;letter-spacing:-.022em;color:#010101;left:80px;top:72px;width:1120px}
.h em{font-style:normal;color:#80ACED}
.logo{position:absolute;left:80px;bottom:64px;width:120px}
svg{position:absolute;left:0;top:0;overflow:visible}
svg text{font-family:'Macan',sans-serif}
.pre{position:absolute;left:-9999px;top:0;opacity:0}

</style></head><body>
<div class="stage">
  <h1 class="h">One system, not <em>two silos</em>.</h1>
  <img class="logo" src="../../brand/logo.svg" alt="">
  <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
  <div class="pre"><span style="font:500 20px Season">a</span><span style="font:400 20px Macan">a</span><span style="font:500 20px Macan">a</span></div>
  
</div>
<script>
const D=10; window.DURATION=D;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), seg=(t,a,b)=>clamp((t-a)/(b-a),0,1), lerp=(a,b,k)=>a+(b-a)*k;
const E={io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, out:x=>1-Math.pow(1-x,3), in:x=>x*x*x, lin:x=>x};
const svg=document.getElementById('svg');
const NS='http://www.w3.org/2000/svg';
const S=(el,a)=>{for(const k in a)el.setAttribute(k,a[k]);return el};
const mk=(tag,a,p)=>{const e=document.createElementNS(NS,tag);S(e,a||{});(p||svg).appendChild(e);return e};
const txt=(x,y,s,a,p)=>{const e=mk('text',Object.assign({x,y},a||{}),p);e.textContent=s;return e};
let _s=12; const rnd=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff};
const INK='#010101', WHITE='#fff', BLUE='#80ACED', FOLLOW=BLUE, SLATE='#869AA6', BEIGE='#F3F1E6', PAPER='#F9F8F3';

// Two teams build the same tower on opposite sides of a wall. The wall comes down, the towers merge, the duplicate dissolves.
const GY=620; mk('line',{x1:80,y1:GY,x2:1200,y2:GY,stroke:INK,'stroke-width':2});
const wall=mk('rect',{x:628,y:270,width:24,height:350,fill:INK});
const BL=['Intake','Research','Draft','Review','Send'], BW=280, BH=60;
const tower=(cx,label,tt)=>{ const g=mk('g'); const blocks=BL.map((b,i)=>{ const bg=mk('g',{},g); mk('rect',{x:cx-BW/2,y:GY-(i+1)*BH,width:BW,height:BH-4,fill:WHITE,stroke:INK,'stroke-width':2},bg); txt(cx,GY-(i+1)*BH+BH/2+4,b,{'font-size':20,'font-weight':500,fill:INK,'text-anchor':'middle'},bg); return bg; });
  const lab=txt(cx,GY-BL.length*BH-24,label,{'font-size':20,'font-weight':500,fill:INK,'text-anchor':'middle'},g); return {g,blocks,cx,tt,lab}; };
const L=tower(400,'Sales team',.5), R=tower(880,'Ops team',.75);
const one=txt(640,GY-BL.length*BH-24,'Sales and Ops, one system',{'font-size':20,'font-weight':500,fill:INK,'text-anchor':'middle',opacity:0});
function render(t){
  const reset=E.in(seg(t,8.8,9.6));
  [L,R].forEach(T=>{
    T.blocks.forEach((b,i)=>{ const k=E.out(seg(t,T.tt+i*.5,T.tt+i*.5+.5)); b.setAttribute('transform',`translate(0 ${lerp(-36,0,k)})`); b.setAttribute('opacity',Math.min(1,k*2.5)); });
    T.lab.setAttribute('opacity',E.out(seg(t,T.tt+2.5,T.tt+3))*(1-E.in(seg(t,5.5,6.0))));
  });
  const down=E.io(seg(t,4.4,5.3)); wall.setAttribute('y',lerp(270,GY,down)); wall.setAttribute('height',lerp(350,0,down));
  if(t>=8.8){ wall.setAttribute('y',lerp(GY,270,E.out(seg(t,9.0,9.6)))); wall.setAttribute('height',lerp(0,350,E.out(seg(t,9.0,9.6)))); }
  const merge=E.io(seg(t,5.5,6.6));
  L.g.setAttribute('transform',`translate(${lerp(0,240,merge)} 0)`); L.g.setAttribute('opacity',1-reset);
  R.g.setAttribute('transform',`translate(${lerp(0,-240,merge)} 0)`); R.g.setAttribute('opacity',(1-E.in(seg(t,6.2,7.0)))*(1-reset));
  one.setAttribute('opacity',E.out(seg(t,6.8,7.3))*(1-reset));
}

window.seek=t=>render(((t%D)+D)%D);
render(0);
if(location.hash==='#play'){(function loop(){render((performance.now()/1000)%D);requestAnimationFrame(loop)})();}
</script></body></html>
