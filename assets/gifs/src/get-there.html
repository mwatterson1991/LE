<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Get there</title>
<style>
@font-face{font-family:'Season';src:url(../../../fonts/SeasonMix-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Medium.woff2) format('woff2');font-weight:500}
:root{--yellow:#FFD96F;--ink:#010101}
html,body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--yellow);font-family:'Macan',sans-serif;-webkit-font-smoothing:antialiased}
.photo{position:absolute;left:0;top:0;width:560px;height:720px;overflow:hidden}
.photo img.bg{position:absolute;left:-4%;top:-4%;width:108%;height:108%;object-fit:cover;object-position:50% 55%;display:block;will-change:transform}
.step{position:absolute;left:0;width:560px;background:var(--yellow);will-change:transform}
.logo{position:absolute;left:44px;top:44px;width:150px}
.tag{position:absolute;left:632px;top:214px;margin:0;font:500 70px/1.02 'Season',Georgia,serif;letter-spacing:-.024em;color:var(--ink)}
.tag .ln{display:block;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
.tag .ln span{display:block;will-change:transform}
.mark{position:absolute;right:72px;bottom:64px;width:48px;height:48px}
</style></head><body>
<div class="stage">
  <div class="photo"><img id="img" class="bg" src="../../brand/board-2.webp" alt=""><div id="steps"></div><img class="logo" id="logo" src="../../brand/logo-white.svg" alt=""></div>
  <h1 class="tag"><span class="ln"><span>Get there,</span></span><span class="ln"><span>with the people</span></span><span class="ln"><span>who've been there.</span></span></h1>
  <img class="mark" src="../../brand/mark.svg" alt="">
</div>
<script>
const D=11; window.DURATION=D;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const E={out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,xo:x=>x>=1?1:1-Math.pow(2,-10*x),
  xio:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2};
const lerp=(a,b,k)=>a+(b-a)*k;
const N=7, SH=720/N, stepsEl=document.getElementById('steps');
const steps=[...Array(N)].map((_,i)=>{const d=document.createElement('div');d.className='step';d.style.top=(i*SH-1)+'px';d.style.height=(SH+2)+'px';stepsEl.appendChild(d);return d;});
const lines=[...document.querySelectorAll('.tag .ln span')];
function render(t){
  // the photo is revealed step by step, bottom to top, as the yellow field slides off each tread; at the end it climbs back
  document.getElementById('logo').style.opacity=E.out(seg(t,1.5,2.3))*(1-E.in(seg(t,9.2,9.9)));
  steps.forEach((el,i)=>{
    const k=N-1-i; // 0 = bottom strip
    const a=E.xio(seg(t,.3+k*.2,1.3+k*.2)), b=E.xio(seg(t,9.2+(N-1-k)*.1,10.1+(N-1-k)*.1));
    el.style.transform=`translateX(${lerp(0,560,a)-b*560}px)`;
  });
  // tagline, line by line, from below; leaves upward
  lines.forEach((s,i)=>{
    const a=E.xo(seg(t,.5+i*.32,1.5+i*.32)), b=E.in(seg(t,8.6+i*.12,9.3+i*.12));
    s.style.transform=`translateY(${lerp(110,0,a)-b*110}%)`;
  });
}
let auto=true; window.seek=t=>{auto=false;render(((t%D)+D)%D)};
(function loop(){if(auto)render((performance.now()/1000)%D);requestAnimationFrame(loop)})();
</script></body></html>
