<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>One system</title>
<style>
@font-face{font-family:'Season';src:url(../../../fonts/SeasonMix-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Book.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Medium.woff2) format('woff2');font-weight:500}
:root{--yellow:#FFD96F;--blue:#80ACED;--slate:#869AA6;--beige:#F3F1E6;--tan:#EBD4B5;--paper:#F9F8F3;--ink:#010101;--neutral:#222}
html,body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--slate);font-family:'Macan',sans-serif;-webkit-font-smoothing:antialiased;color:var(--neutral)}
.h{position:absolute;left:80px;top:72px;width:420px;margin:0;font:500 60px/1.02 'Season',Georgia,serif;letter-spacing:-.022em;color:#fff}
.sub{position:absolute;left:80px;top:230px;width:380px;font:400 20px/1.35 'Macan';color:#fff;opacity:0}
.logo{position:absolute;left:80px;bottom:64px;width:120px}
.slab{position:absolute;left:640px;width:560px;height:84px;border-radius:14px;box-sizing:border-box;padding:0 30px;display:flex;align-items:center;font:500 22px/1 'Macan';color:var(--ink);opacity:0;will-change:transform}
.person{position:absolute;left:640px;width:560px;height:220px;border-radius:14px;overflow:hidden;opacity:0;will-change:transform}
.person img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
.person span{position:absolute;left:30px;bottom:22px;font:500 22px/1 'Macan';color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.35)}
</style></head><body>
<div class="stage">
  <h1 class="h">Everyone is a builder now.</h1>
  <img class="logo" src="../../brand/logo-white.svg" alt="">
  <div id="stack"></div>
</div>
<script>
const D=10.5; window.DURATION=D;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const E={out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,xo:x=>x>=1?1:1-Math.pow(2,-10*x),
  xio:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  back:(x,s=1.3)=>{const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)}};
const lerp=(a,b,k)=>a+(b-a)*k;
const SL=[{t:'Skills',c:'#F3F1E6'},{t:'Workflows',c:'#EBD4B5'},{t:'Agents',c:'#FFD96F'},{t:'Systems',c:'#F9F8F3'}];
const H=84,G=10,BOT=656;
const stack=document.getElementById('stack');
const slabs=SL.map((s,i)=>{const d=document.createElement('div');d.className='slab';d.style.background=s.c;d.textContent=s.t;d.style.top=(BOT-H-i*(H+G))+'px';stack.appendChild(d);return d;});
const person=document.createElement('div');person.className='person';person.style.top=(BOT-4*(H+G)-220)+'px';
person.innerHTML=`<img src="../../brand/board-6.webp" alt=""><span></span>`;stack.appendChild(person);
const IN=i=>.4+i*.55;
function render(t){
  const out=i=>E.in(seg(t,8.3+i*.09,9.0+i*.09));
  slabs.forEach((el,i)=>{
    const k=E.back(seg(t,IN(i),IN(i)+.9),1.1), o=seg(t,IN(i),IN(i)+.15);
    const dir=i%2?1:-1; // alternate sides
    let y=0; for(let j=i+1;j<5;j++){const p=seg(t,IN(j)+.5,IN(j)+1.0); y+=Math.sin(p*Math.PI)*6*(1-(j-i-1)*.3);}
    const ox=out(i);
    el.style.opacity=o*(1-ox); el.style.transform=`translate(${lerp(dir*640,0,k)+ox*160}px,${y}px)`;
  });
  const kp=E.back(seg(t,IN(4),IN(4)+1.0),1.0), op=seg(t,IN(4),IN(4)+.15), ox=out(4);
  person.style.opacity=op*(1-ox); person.style.transform=`translate(${ox*160}px,${lerp(-420,0,kp)}px)`;
}
let auto=true; window.seek=t=>{auto=false;render(((t%D)+D)%D)};
(function loop(){if(auto)render((performance.now()/1000)%D);requestAnimationFrame(loop)})();
</script></body></html>
