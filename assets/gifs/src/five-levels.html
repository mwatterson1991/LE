<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Five levels</title>
<style>
@font-face{font-family:'Season';src:url(../../../fonts/SeasonMix-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Book.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Medium.woff2) format('woff2');font-weight:500}
:root{--yellow:#FFD96F;--blue:#80ACED;--beige:#F3F1E6;--tan:#EBD4B5;--paper:#F9F8F3;--ink:#010101;--neutral:#222}
html,body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--beige);font-family:'Macan',sans-serif;-webkit-font-smoothing:antialiased;color:var(--neutral)}
.eyebrow{position:absolute;left:80px;top:72px;font:500 18px/1 'Macan';color:var(--ink)}
.h{position:absolute;left:80px;top:300px;width:400px;margin:0;font:500 54px/1.02 'Season',Georgia,serif;letter-spacing:-.022em;color:var(--ink)}
.h b{font-weight:500;color:var(--blue)}
.card{position:absolute;left:560px;width:640px;height:88px;background:#fff;border-radius:14px;box-sizing:border-box;padding:0 28px;display:flex;align-items:center;gap:22px;opacity:0;will-change:transform;transform-origin:50% 100%}
.card .n{font:500 16px/1 'Macan';color:var(--ink);opacity:.5;width:66px}
.card .t{font:500 25px/1.1 'Macan';color:var(--ink);letter-spacing:-.012em}
.card.top{background:var(--yellow)}
.card.top .n{opacity:.7}
.mark{position:absolute;left:80px;bottom:64px;width:30px;height:30px}
</style></head><body>
<div class="stage">
  <div class="eyebrow">The AI Builder Program</div>
  <h1 class="h">Each level of the program builds directly <b>on the last.</b></h1>
  <div id="cards"></div>
  <img class="mark" src="../../brand/mark.svg" alt="">
</div>
<script>
const D=10; window.DURATION=D;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const E={out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,xo:x=>x>=1?1:1-Math.pow(2,-10*x),
  xio:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  back:(x,s=1.4)=>{const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)}};
const lerp=(a,b,k)=>a+(b-a)*k;
const LV=['Use AI to 10x your impact','Build complex agentic workflows','Create autonomous agents','Build your agent workforce','Design your AI orchestration layer'];
const H=88, GAP=12, BOTTOM=648; // stack grows upward from y=BOTTOM
const slotY=i=>BOTTOM-H-i*(H+GAP);
const wrap=document.getElementById('cards');
const cards=LV.map((t,i)=>{const d=document.createElement('div');d.className='card'+(i===4?' top':'');d.innerHTML=`<span class="n">Level ${i+1}</span><span class="t">${t}</span>`;wrap.appendChild(d);return d;});
const L=i=>.5+i*.78;           // landing start per card
function render(t){
  cards.forEach((c,i)=>{
    // drop in from above with weight (back-ease settle), fade in fast
    const k=E.back(seg(t,L(i),L(i)+.7),1.25), o=seg(t,L(i),L(i)+.2);
    let y=lerp(slotY(i)-140,slotY(i),k), sc=lerp(1.04,1,k);
    // cards below take the weight of each new landing: a short compress-and-recover
    for(let j=i+1;j<5;j++){const p=seg(t,L(j)+.42,L(j)+.95); y+=Math.sin(p*Math.PI)*(1-p*.5)*7*(1-(j-i-1)*.25);}
    // exit: slide left, staggered from the top
    const x=E.in(seg(t,8.1+(4-i)*.1,8.75+(4-i)*.1));
    // the stack settles back a touch as it grows: lower cards recede slightly
    const top=Math.min(4,Math.max(0,Math.floor((t-.5)/.78)));
    const depth=clamp(top-i,0,4); sc*=1-depth*.012;
    c.style.opacity=o*(1-x)*(1-depth*.06); c.style.transform=`translate(${-x*120}px,${y}px) scale(${sc})`;
  });
}
let auto=true; window.seek=t=>{auto=false;render(((t%D)+D)%D)};
(function loop(){if(auto)render((performance.now()/1000)%D);requestAnimationFrame(loop)})();
</script></body></html>
