<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Your work</title>
<style>
@font-face{font-family:'Season';src:url(../../../fonts/SeasonMix-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Book.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-SemiBold.woff2) format('woff2');font-weight:600}
:root{--ink:#111;--ink2:#4c4c4c;--ink3:#767676;--g2:#eee;--blue:#2f5fd6;--sky:#80aced}
html,body{margin:0;background:#fff}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#fff;font-family:'Macan',sans-serif;-webkit-font-smoothing:antialiased}
h1{position:absolute;left:80px;top:72px;margin:0;font-family:'Season',serif;font-weight:500;font-size:56px;line-height:1.08;letter-spacing:-.01em;color:var(--ink);max-width:800px}
h1 b{font-weight:500;color:var(--blue)}
.mark{position:absolute;right:80px;bottom:60px;width:30px}
svg{position:absolute;left:0;top:0}
.name{font-family:'Macan',sans-serif;font-weight:500;font-size:22px;fill:#111}
.src{font-family:'Macan',sans-serif;font-weight:500;font-size:15px;fill:#767676}
</style></head><body>
<div class="stage">
  <h1>Built on <b>your work,</b> not examples.</h1>
  <svg id="s" width="1280" height="720" viewBox="0 0 1280 720" fill="none" stroke-linecap="round" stroke-linejoin="round"></svg>
  <img class="mark" src="../../logomark.png" alt="">
</div>
<script>
const D=9; window.DURATION=D;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const mix=(a,b,k)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')';};
const TW=300,TH=200,TY=330,TX=[80,490,900];
const NAMES=['Research','Draft','Send'], SRC=['Your docs','Your spreadsheets','Your inbox'];
// glyphs drawn in a 64x64 box centered at 0,0
const GLYPH=[
 // document with folded corner + lines
 `<path d="M-20 -28 H8 L20 -16 V28 H-20 Z"/><path d="M8 -28 V-16 H20"/><path d="M-10 0 H10 M-10 10 H10 M-10 20 H2"/>`,
 // spreadsheet grid
 `<rect x="-28" y="-20" width="56" height="40" rx="4"/><path d="M-28 -6 H28 M-28 8 H28 M-10 -20 V20 M10 -20 V20"/>`,
 // inbox tray with envelope
 `<path d="M-28 -16 H28 V22 H-28 Z"/><path d="M-28 -16 L0 4 L28 -16"/>`
];
const svg=document.getElementById('s'); let html='';
for(let i=0;i<3;i++){const x=TX[i],cx=x+TW/2,cy=TY+TH/2;
  html+=`<rect id="tile${i}" x="${x}" y="${TY}" width="${TW}" height="${TH}" rx="18" stroke="#eee" stroke-width="2"/>`;
  html+=`<g id="g${i}" stroke="#4c4c4c" stroke-width="2" transform="translate(${cx} ${cy})">${GLYPH[i]}</g>`;
  html+=`<text id="src${i}" class="src" x="${cx}" y="${TY+TH+34}" text-anchor="middle">${SRC[i]}</text>`;
  html+=`<text id="nm${i}" class="name" x="${x+28}" y="${TY+TH-28}">${NAMES[i]}</text>`;
  const ck=`M${x+TW-42} ${TY+30} l5 5 l10 -10`;
  html+=`<circle id="ckc${i}" cx="${x+TW-36}" cy="${TY+30}" r="13" stroke="#2f5fd6" stroke-width="2" stroke-dasharray="82" stroke-dashoffset="82"/><path id="ck${i}" d="${ck}" stroke="#2f5fd6" stroke-width="2.2" stroke-dasharray="22" stroke-dashoffset="22"/>`;
}
for(let i=0;i<2;i++){const x1=TX[i]+TW,x2=TX[i+1],y=TY+TH/2;html+=`<path id="ln${i}" d="M${x1} ${y} H${x2}" stroke="#2f5fd6" stroke-width="2" stroke-dasharray="${x2-x1}" stroke-dashoffset="${x2-x1}"/><circle id="ld${i}" cx="${x2-6}" cy="${y}" r="4" fill="#2f5fd6" opacity="0"/>`;}
svg.innerHTML=html;
const $=id=>document.getElementById(id);
function render(t){
  const m=eio(seg(t,2.6,3.4));            // morph
  const fade=seg(t,7.6,8.2);              // system fades out
  const back=eo(seg(t,8.3,8.9));          // generic glyphs return
  for(let i=0;i<3;i++){const x=TX[i],cx=x+TW/2,cy=TY+TH/2;
    const k=t<7.6?m:(1-fade); // 0 generic, 1 system
    $('tile'+i).setAttribute('stroke',mix('#eeeeee','#111111',k));
    // glyph: center 64px -> top-left small
    const gx=cx+(x+28+16-cx)*m, gy=cy+(TY+28+16-cy)*m, sc=1-0.5*m;
    const g=$('g'+i); g.setAttribute('transform',`translate(${gx} ${gy}) scale(${sc})`);
    g.setAttribute('stroke',mix('#4c4c4c','#111111',m));
    let gop=1; if(t>=7.6)gop=Math.max(1-fade,back); g.setAttribute('opacity',gop);
    if(t>=8.3){g.setAttribute('transform',`translate(${cx} ${cy})`);g.setAttribute('stroke','#4c4c4c');}
    const so=t<7.6?1-seg(t,2.4,2.8):back; $('src'+i).setAttribute('opacity',so);
    const no=t<7.6?seg(t,3.1,3.5):1-fade; $('nm'+i).setAttribute('opacity',no);
    const ct=[3.9,5.0,6.1][i]; const c=eo(seg(t,ct,ct+0.35)), ck=eo(seg(t,ct+0.2,ct+0.5));
    const cop=t<7.6?1:1-fade;
    $('ckc'+i).setAttribute('stroke-dashoffset',82*(1-c)); $('ckc'+i).setAttribute('opacity',cop);
    $('ck'+i).setAttribute('stroke-dashoffset',22*(1-ck)); $('ck'+i).setAttribute('opacity',cop);
  }
  for(let i=0;i<2;i++){const lt=[4.3,5.4][i]; const d=eio(seg(t,lt,lt+0.6)); const len=TX[i+1]-TX[i]-TW;
    $('ln'+i).setAttribute('stroke-dashoffset',len*(1-d)); $('ln'+i).setAttribute('opacity',t<7.6?1:1-fade);
    $('ld'+i).setAttribute('opacity',(d>=1?1:0)*(t<7.6?1:1-fade));
  }
}
let auto=true; window.seek=t=>{auto=false;render(((t%D)+D)%D)};
(function loop(){if(auto)render((performance.now()/1000)%D);requestAnimationFrame(loop)})();
</script></body></html>
