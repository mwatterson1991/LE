<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Built on your work, not examples.</title>
<style>
@font-face{font-family:'Season';src:url(../../../fonts/SeasonMix-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Book.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'QMark';src:local('Helvetica Neue'),local('Helvetica'),local('Arial'),local('Liberation Sans');unicode-range:U+003F}
html,body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#ffffff;font-family:'QMark','Macan',sans-serif;-webkit-font-smoothing:antialiased;color:#0f0f10}
.h{position:absolute;left:80px;top:76px;width:520px;margin:0;font:500 70px/1.04 'QMark','Season',Georgia,serif;letter-spacing:-.022em;color:#0f0f10}
.h em{font-style:normal;color:#80ACED}
.h span{display:block}
.logo{position:absolute;left:80px;bottom:64px;width:66px}
svg#svg{position:absolute;left:0;top:0;overflow:visible}
svg text{font-family:'QMark','Macan',sans-serif}
.pre{position:absolute;left:-9999px;top:0;opacity:0}

</style></head><body>
<div class="stage">
  
  <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"><defs id="defs"></defs></svg>
  <h1 class="h" id="h">Built on <em>your work</em>, not examples.</h1>
  <img class="logo" src="../../brand/logo.svg" alt="">
  <div class="pre"><span style="font:500 20px Season">a</span><span style="font:400 20px Macan">a</span><span style="font:500 20px Macan">a</span></div>
</div>
<script>
const D=9; window.DURATION=D;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), seg=(t,a,b)=>clamp((t-a)/(b-a),0,1), lerp=(a,b,k)=>a+(b-a)*k;
function bez(x1,y1,x2,y2){const f=(u,a,b)=>3*(1-u)*(1-u)*u*a+3*(1-u)*u*u*b+u*u*u;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,u=.5;for(let i=0;i<26;i++){u=(lo+hi)/2;if(f(u,x1,x2)<x)lo=u;else hi=u}return f(u,y1,y2)}}
const ez=bez(.2,.8,.2,1), ezio=bez(.77,0,.18,1);   // the guide's two curves
const at=(t,a,d)=>ez(seg(t,a,a+(d||.7)));           // "arrive": 0..1 starting at a
const INK='#0f0f10', G1='#5c5f66', G2='#9a9ca1', G3='#c9cacd', HAIR='#ececed', SOFT='#f4f4f5', SKY='#80ACED', FIELD='#ffffff';
const svg=document.getElementById('svg'), defs=document.getElementById('defs');
const NS='http://www.w3.org/2000/svg';
const S=(el,a)=>{for(const k in a)el.setAttribute(k,a[k]);return el};
const g=S(document.createElementNS(NS,'g'),{});svg.appendChild(g);
const mk=(tag,a,p)=>{const e=document.createElementNS(NS,tag);S(e,a||{});(p||g).appendChild(e);return e};
const line=(x1,y1,x2,y2,c,w,p)=>mk('line',{x1,y1,x2,y2,stroke:c||INK,'stroke-width':w||2,'stroke-linecap':'round'},p);
const dot=(cx,cy,r,c,p)=>mk('circle',{cx,cy,r,fill:c||INK},p);
const lab=(x,y,s,anchor,c,p)=>{const e=mk('text',{x,y,'font-size':24,fill:c||G1,'text-anchor':anchor||'start'},p);e.textContent=s;return e};
const op=(el,o)=>el.setAttribute('opacity',clamp(o,0,1));
const rise=(el,k,dy)=>{op(el,k);el.setAttribute('transform',`translate(0 ${((1-k)*(dy==null?10:dy)).toFixed(2)})`)};
const grow=(el,x1,y1,x2,y2,k)=>{S(el,{x1,y1,x2:lerp(x1,x2,k),y2:lerp(y1,y2,k)});el.setAttribute('visibility',k>0.001?'visible':'hidden')};
const dash=(p,k)=>{const L=p._L||(p._L=p.getTotalLength());p.setAttribute('stroke-dasharray',`${(L*k).toFixed(2)} ${L+4}`);p.setAttribute('visibility',k>0.001?'visible':'hidden')};
let _id=0;
function face(x,y,s,slug,p){const id='fc'+(_id++);const cp=mk('clipPath',{id},defs);mk('rect',{x,y,width:s,height:s,rx:6},cp);
  const gg=mk('g',{},p);mk('image',{href:`../../experts/${slug}.jpg`,x,y,width:s,height:s,'clip-path':`url(#${id})`,preserveAspectRatio:'xMidYMid slice'},gg);return gg}
function door(x,y,w,h,p){const gg=mk('g',{},p);
  const inside=mk('rect',{x,y,width:w,height:h,fill:SKY,opacity:0},gg);
  const frame=mk('rect',{x,y,width:w,height:h,fill:'none',stroke:INK,'stroke-width':2},gg);
  const leaf=mk('polygon',{fill:FIELD,stroke:INK,'stroke-width':2,'stroke-linejoin':'round'},gg);
  const knob=mk('circle',{r:w>100?4:2.5,fill:INK},gg);
  return {gg,inside,set(k,c,sky){const th=k*1.12, lw=w*Math.cos(th), dy=Math.sin(th)*h*.06;
    leaf.setAttribute('points',`${x},${y} ${x+lw},${y-dy} ${x+lw},${y+h+dy} ${x},${y+h}`);
    S(knob,{cx:x+lw*.8,cy:y+h*.53,fill:c||INK});frame.setAttribute('stroke',c||INK);leaf.setAttribute('stroke',c||INK);
    op(inside,sky?seg(k,0,.25):0)}}}
const FADE=true;

// A doc, a sheet and an inbox, lying around. They line up and become one flow.
const Y=350, XS=[740,930,1120];
const st={fill:'none',stroke:INK,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'};
const ic=XS.map(()=>mk('g'));
mk('path',Object.assign({d:'M-17 -23 h22 l12 12 v34 h-34 z M5 -23 v12 h12 M-8 2 h16 M-8 11 h16'},st),ic[0]);
mk('path',Object.assign({d:'M-23 -18 h46 v36 h-46 z M-23 -6 h46 M-23 6 h46 M-7 -18 v36'},st),ic[1]);
mk('path',Object.assign({d:'M-24 -17 h48 v34 h-48 z M-24 -17 l24 19 l24 -19'},st),ic[2]);
const OFF=[{dy:-46,r:-9},{dy:34,r:7},{dy:-18,r:-5}], IN=[.5,1.0,1.7];
const link=[line(0,0,0,0,INK,2),line(0,0,0,0,INK,2)];
const words=['Research','Draft','Send'].map((s,i)=>lab(XS[i],Y+72,s,'middle',INK));
const run=dot(0,Y,6,SKY);
function render(t){
  const al=ezio(seg(t,2.6,3.7));
  ic.forEach((e,i)=>{op(e,at(t,IN[i],.6));e.setAttribute('transform',`translate(${XS[i]} ${Y+OFF[i].dy*(1-al)}) rotate(${OFF[i].r*(1-al)})`)});
  link.forEach((l,i)=>grow(l,XS[i]+38,Y,XS[i+1]-38,Y,at(t,3.8+i*.55,.6)));
  words.forEach((w,i)=>rise(w,at(t,[4.2,4.8,5.6][i],.6),8));
  const k=ezio(seg(t,6.0,7.6));
  S(run,{cx:lerp(XS[0]+38,XS[2]-38,k)});
  const cx=lerp(XS[0]+38,XS[2]-38,k);
  op(run,(Math.abs(cx-XS[1])<38?0:1)*Math.min(seg(t,6.0,6.15),1-seg(t,7.5,7.6)));
}

function frame(t){render(t);if(FADE)op(g,Math.min(ez(seg(t,.15,.8)),1-ez(seg(t,D-.8,D-.15))))}
window.seek=t=>frame(((t%D)+D)%D);
frame(0);
if(location.hash==='#play'){(function loop(){frame((performance.now()/1000)%D);requestAnimationFrame(loop)})();}
</script></body></html>
