<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>One person, more output</title>
<style>
@font-face{font-family:'Season';src:url(../../../fonts/SeasonMix-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Book.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Medium.woff2) format('woff2');font-weight:500}
:root{--blue:#80ACED;--slate:#869AA6;--beige:#F3F1E6;--paper:#F9F8F3;--ink:#010101;--neutral:#222}
html,body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#FFFFFF;font-family:'Macan',sans-serif;-webkit-font-smoothing:antialiased;color:#010101}
.h{position:absolute;margin:0;font:500 70px/1.04 'Season',Georgia,serif;letter-spacing:-.022em;color:#010101;left:80px;top:80px;width:500px}
.h em{font-style:normal;color:#80ACED}
.logo{position:absolute;left:80px;bottom:64px;width:120px}
svg{position:absolute;left:0;top:0;overflow:visible}
svg text{font-family:'Macan',sans-serif}
.pre{position:absolute;left:-9999px;top:0;opacity:0}

</style></head><body>
<div class="stage">
  <h1 class="h">One person, <em>more output</em>.</h1>
  <img class="logo" src="../../brand/logo.svg" alt="">
  <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
  <div class="pre"><span style="font:500 20px Season">a</span><span style="font:400 20px Macan">a</span><span style="font:500 20px Macan">a</span></div>
  
</div>
<script>
const D=10; window.DURATION=D;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), seg=(t,a,b)=>clamp((t-a)/(b-a),0,1), lerp=(a,b,k)=>a+(b-a)*k;
const E={io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, out:x=>1-Math.pow(1-x,3), in:x=>x*x*x, lin:x=>x};
const svg=document.getElementById('svg');
const NS='http://www.w3.org/2000/svg';
const S=(el,a)=>{for(const k in a)el.setAttribute(k,a[k]);return el};
const mk=(tag,a,p)=>{const e=document.createElementNS(NS,tag);S(e,a||{});(p||svg).appendChild(e);return e};
const txt=(x,y,s,a,p)=>{const e=mk('text',Object.assign({x,y},a||{}),p);e.textContent=s;return e};
let _s=2; const rnd=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff};
const INK='#010101', WHITE='#fff', BLUE='#80ACED', FOLLOW=BLUE, SLATE='#869AA6', BEIGE='#F3F1E6', PAPER='#F9F8F3';

// One person at a desk. Agents fan out and start finishing work. Output grows; headcount stays at one.
const PX=700, PY=300;
const clip=mk('clipPath',{id:'c'},mk('defs')); mk('circle',{cx:PX,cy:PY,r:60},clip);
mk('image',{href:'../../experts/mia-t.jpg',x:PX-60,y:PY-60,width:120,height:120,'clip-path':'url(#c)',preserveAspectRatio:'xMidYMid slice'});
txt(PX,PY+96,'Headcount',{'font-size':18,'font-weight':500,fill:INK,'text-anchor':'middle',opacity:.7});
txt(PX,PY+150,'1',{'font-size':56,'font-family':'Season',fill:INK,'text-anchor':'middle'});
const A=[{n:'Research agent',y:150},{n:'Outreach agent',y:290},{n:'Reporting agent',y:430}];
const cards=A.map((a,i)=>{
  const g=mk('g'); const link=mk('line',{x1:PX+60,y1:PY,x2:880,y2:a.y+48,stroke:INK,'stroke-width':1.5,opacity:.4},g);
  const b=mk('g',{},g);
  mk('rect',{x:880,y:a.y,width:320,height:96,fill:WHITE,stroke:INK,'stroke-width':1.5},b);
  txt(902,a.y+36,a.n,{'font-size':21,'font-weight':500,fill:INK},b);
  const ticks=[0,1,2,3,4].map(j=>{ const tg=mk('g',{transform:`translate(${902+j*30} ${a.y+54})`},b); mk('rect',{x:0,y:0,width:22,height:22,fill:'none',stroke:INK,'stroke-width':1.4},tg); const f=mk('rect',{x:0,y:0,width:22,height:22,fill:FOLLOW,opacity:0},tg); return f; });
  return {g,b,link,ticks,t:.6+i*.7,y:a.y};
});
// output bar
txt(880,588,'Output',{'font-size':18,'font-weight':500,fill:INK,opacity:.7});
mk('rect',{x:880,y:600,width:320,height:36,fill:'none',stroke:INK,'stroke-width':1.5});
const bar=mk('rect',{x:880,y:600,width:48,height:36,fill:FOLLOW});
// tick schedule: 15 ticks between 2.6 and 6.4, round-robin
const sched=[]; for(let j=0;j<5;j++)for(let i=0;i<3;i++)sched.push({i,j,t:2.6+(j*3+i)*.25});
function render(t){
  const reset=E.in(seg(t,8.5,9.3));
  cards.forEach(c=>{
    const k=E.out(seg(t,c.t,c.t+.7))*(1-reset);
    const vis=t>=c.t?1:0;
    const dx=lerp(PX-880-100,0,k), dy=lerp(PY-48-c.y,0,k);
    c.g.setAttribute('opacity',Math.min(1,k*2)*vis);
    c.b.setAttribute('transform',`translate(${dx} ${dy}) scale(${lerp(.5,1,k)})`);
    c.b.setAttribute('transform-origin',`880 ${c.y+48}`);
    c.link.setAttribute('x2',880+dx); c.link.setAttribute('y2',c.y+48+dy);
  });
  let done=0;
  sched.forEach(s=>{ const k=E.out(seg(t,s.t,s.t+.25))*(1-reset); cards[s.i].ticks[s.j].setAttribute('opacity',k); done+=k; });
  bar.setAttribute('width',48+done/15*272);
}

window.seek=t=>render(((t%D)+D)%D);
render(0);
if(location.hash==='#play'){(function loop(){render((performance.now()/1000)%D);requestAnimationFrame(loop)})();}
</script></body></html>
