@font-face{font-family:'Season';src:url(../../../fonts/SeasonMix-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Medium.woff2) format('woff2');font-weight:500}
:root{--yellow:#FFD96F;--ink:#010101}
html,body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--yellow);font-family:'Macan',sans-serif;-webkit-font-smoothing:antialiased}
.layer{position:absolute;inset:0}
#lockup{position:absolute;left:50%;top:50%;width:620px;height:auto;transform:translate(-50%,-50%);overflow:visible}
#lockup path{fill:var(--ink);stroke:var(--ink);stroke-width:.22;stroke-linecap:round;stroke-linejoin:round}
#mark{position:absolute;right:72px;bottom:64px;width:88px;height:88px;transform-origin:0 0}
#mark path{fill:var(--ink)}
#tag{position:absolute;left:80px;top:76px;margin:0;font:500 112px/.98 'Season',Georgia,serif;letter-spacing:-.025em;color:var(--ink);white-space:pre-wrap}
#tag span{opacity:0}
#cursor{position:absolute;width:6px;height:96px;background:var(--ink);opacity:0}
#wipe{position:absolute;inset:0;background:var(--yellow);clip-path:inset(100% 0 0 0)}

<script>
const D=10; window.DURATION=D;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const E={out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,xo:x=>x>=1?1:1-Math.pow(2,-10*x),
  xio:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  back:(x,s=1.4)=>{const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)}};
const lerp=(a,b,k)=>a+(b-a)*k;
// type
const TXT='Own your\nfuture.';
const tag=document.getElementById('tag');
tag.innerHTML=[...TXT].map(ch=>ch==='\n'?'<br>':`<span>${ch===' '?'&nbsp;':ch}</span>`).join('');
const chars=[...tag.querySelectorAll('span')];
const cursor=document.getElementById('cursor');
const paths=[...document.querySelectorAll('#lockup path')];
const lens=paths.map(p=>p.getTotalLength());
const lockup=document.getElementById('lockup'), mark=document.getElementById('mark'), wipe=document.getElementById('wipe'), content=document.getElementById('content');
// char positions (measured once with all visible)
function measure(){return chars.map(c=>({x:c.offsetLeft,y:c.offsetTop,w:c.offsetWidth}))}
function render(t){
  const pos=measure();
  // 1. lockup draws on (stroke), then fills
  const draw=E.xo(seg(t,.3,1.9)), fill=E.out(seg(t,1.3,2.1));
  paths.forEach((p,i)=>{
    const L=lens[i], k=clamp(draw*1.25-i*.08,0,1);
    p.style.strokeDasharray=L; p.style.strokeDashoffset=L*(1-k);
    p.style.fillOpacity=fill; p.style.strokeOpacity=1-fill*.999+.001;
  });
  // 2. wordmark fades, mark glides to bottom-right and shrinks; the tagline types in
  // wordmark fades; the mark (a separate element placed exactly over the lockup's mark) glides to the bottom-right and settles
  document.getElementById('wm').style.opacity=1-E.in(seg(t,2.45,2.95));
  lockup.style.opacity=t<2.7?1:0;
  const mk=E.back(seg(t,2.7,3.8),1.1);
  mark.style.opacity=t>=2.7?1:0; mark.style.transform=`translate(${lerp(-785,0,mk)}px,${lerp(-273,0,mk)}px) scale(${lerp(1.48,1,mk)})`;
  const n=chars.length, tp=seg(t,3.2,4.7);
  const shown=Math.floor(E.out(tp)*n*1.0001);
  chars.forEach((c,i)=>c.style.opacity=i<shown?1:0);
  const last=pos[clamp(shown-1,0,n-1)];
  const cx=shown>0?last.x+last.w+8:pos[0].x, cy=shown>0?last.y+10:pos[0].y+10;
  cursor.style.transform=`translate(${cx+80}px,${cy+76}px)`;
  const blink=t<3.2?0:t<4.7?1:(t<6.2?(Math.floor((t-4.7)*2.4)%2===0?1:0):0);
  cursor.style.opacity=blink;
  // 3. loop out: a fresh yellow tile pushes up from below, like the board
  const w=E.xio(seg(t,8.2,9.3));
  wipe.style.clipPath=`inset(${(1-w)*100}% 0 0 0)`;
  content.style.transform=`translateY(${-w*300}px)`;
  content.style.opacity=t>9.3?0:1;
}
let auto=true; window.seek=t=>{auto=false;render(((t%D)+D)%D)};
(function loop(){if(auto)render((performance.now()/1000)%D);requestAnimationFrame(loop)})();
</script></body></html>
