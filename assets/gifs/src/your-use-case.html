<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Your use case</title>
<style>
@font-face{font-family:'Season';src:url(../../../fonts/SeasonMix-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Book.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Macan';src:url(../../../fonts/Macan-Medium.woff2) format('woff2');font-weight:500}
:root{--yellow:#FFD96F;--blue:#80ACED;--beige:#F3F1E6;--tan:#EBD4B5;--paper:#F9F8F3;--ink:#010101;--neutral:#222;--follow:#3963D7}
html,body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--tan);font-family:'Macan',sans-serif;-webkit-font-smoothing:antialiased;color:var(--neutral)}
.h{position:absolute;left:80px;top:72px;width:460px;margin:0;font:500 58px/1.02 'Season',Georgia,serif;letter-spacing:-.022em;color:var(--ink)}
.h b{font-weight:500;color:var(--blue)}
.eyebrow{position:absolute;left:80px;bottom:64px;font:500 18px/1 'Macan';color:var(--ink)}
.tile{position:absolute;background:var(--paper);border-radius:22px;overflow:hidden;will-change:transform}
.logo{position:absolute;will-change:transform;transform-origin:0 0}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.rows{position:absolute;left:44px;right:44px;top:124px}
.row{position:relative;height:60px;display:flex;align-items:center;gap:16px;opacity:0}
.row .lb{font:500 22px/1 'Macan';color:var(--ink);width:190px}
.row .bar{flex:1;height:8px;border-radius:4px;background:#E9E6DA;overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--blue);transform-origin:0 50%;transform:scaleX(0)}
.row .ok{width:24px;height:24px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;opacity:0;transform:scale(.5)}
.row .ok svg{width:13px;height:13px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.hdr{position:absolute;left:116px;top:58px;font:500 18px/1.2 'Macan';color:#5d5d59;opacity:0}
.mark{position:absolute;right:80px;bottom:60px;width:34px;height:34px}
</style></head><body>
<div class="stage">
  <h1 class="h">Build an AI-native company, <b>quickly.</b></h1>
  <div class="eyebrow">The AI Builder Program</div>
  <div class="tile" id="tile">
    <div class="hdr" id="hdr">Research, communication and analysis</div>
    <div class="rows"><div class="row"><span class="lb">Research</span><span class="bar"><i></i></span><span class="ok"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4L18 8"/></svg></span></div><div class="row"><span class="lb">Communication</span><span class="bar"><i></i></span><span class="ok"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4L18 8"/></svg></span></div><div class="row"><span class="lb">Analysis</span><span class="bar"><i></i></span><span class="ok"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4L18 8"/></svg></span></div></div>
  </div>
  <div class="logo" id="logo"><img id="li" src="../../orgs/mono/Google-black.png" alt=""></div>
  <img class="mark" src="../../brand/mark.svg" alt="">
</div>
<script>
const D=10.5; window.DURATION=D;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const E={out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,xo:x=>x>=1?1:1-Math.pow(2,-10*x),
  xio:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  back:(x,s=1.2)=>{const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)}};
const lerp=(a,b,k)=>a+(b-a)*k;
const ORGS=['Google','Goldman_Sachs','Microsoft'];
const PER=D/3;
const tile=document.getElementById('tile'), logo=document.getElementById('logo'), li=document.getElementById('li'), hdr=document.getElementById('hdr');
const rows=[...document.querySelectorAll('.row')];
// collapsed: 300x300 tile centered at (930,400); expanded: 600x330 at (600..1200, 235..565)
const C={x:770,y:220,w:320,h:320}, X={x:580,y:200,w:620,h:360};
function render(t){
  const k=Math.floor(t/PER), u=t-k*PER;
  li.src=`../../orgs/mono/${ORGS[k]}-black.png`;
  const open=E.xio(seg(u,.25,1.05)), close=E.xio(seg(u,PER-.95,PER-.2));
  const m=open-close; // 0 collapsed, 1 expanded
  const r={x:lerp(C.x,X.x,m),y:lerp(C.y,X.y,m),w:lerp(C.w,X.w,m),h:lerp(C.h,X.h,m)};
  tile.style.left=r.x+'px';tile.style.top=r.y+'px';tile.style.width=r.w+'px';tile.style.height=r.h+'px';
  // logo: 120px centered in the collapsed tile -> 48px at the tile's top-left when expanded
  const ls=lerp(128,52,m), lx=lerp(C.x+96,X.x+44,m), ly=lerp(C.y+96,X.y+44,m);
  logo.style.left=lx+'px';logo.style.top=ly+'px';logo.style.width=ls+'px';logo.style.height=ls+'px';
  // the logo swaps while the tile is collapsed: a quick drop-and-rise between orgs at the seam
  const sw=u<.25?E.out(seg(u,0,.25)):1, swo=u>PER-.2?E.in(seg(u,PER-.2,PER)):0;
  logo.style.opacity=sw*(1-swo); logo.style.transform=`translateY(${lerp(14,0,sw)+swo*-14}px)`;
  hdr.style.opacity=seg(m,.7,1);
  rows.forEach((row,i)=>{
    const st=1.0+i*.72;
    row.style.opacity=seg(u,.9+i*.08,1.15+i*.08)*(1-seg(u,PER-1.0,PER-.85));
    const run=E.xio(seg(u,st,st+.7));
    row.querySelector('.bar i').style.transform=`scaleX(${run})`;
    const ok=E.back(seg(u,st+.6,st+.95),1.6);
    const okEl=row.querySelector('.ok'); okEl.style.opacity=seg(u,st+.6,st+.7); okEl.style.transform=`scale(${lerp(.5,1,ok)})`;
  });
}
let auto=true; window.seek=t=>{auto=false;render(((t%D)+D)%D)};
(function loop(){if(auto)render((performance.now()/1000)%D);requestAnimationFrame(loop)})();
</script></body></html>
