<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 1: acceptance rates over time</title>
<link rel="stylesheet" href="base.css">
<style>
  svg{position:absolute;left:0;top:0;width:1080px;height:1350px;overflow:visible}
  .ax{font-family:var(--helv);font-size:18px;fill:var(--grey);font-variant-numeric:tabular-nums}
  .axn{font-family:'Macan',sans-serif;font-size:19px;fill:var(--grey)}
  #now{position:absolute;top:234px;font-family:var(--helv);font-weight:700;font-size:30px;line-height:36px;font-variant-numeric:tabular-nums;white-space:nowrap;transform:translateX(-50%)}
  #scrub{position:absolute;left:60px;top:240px;width:960px;height:960px;cursor:ew-resize;touch-action:none}
  .tip{position:absolute;left:0;top:0;height:44px;display:flex;align-items:center;will-change:transform,opacity;pointer-events:none}
  .tip .logo,.tip .ph,.tip .nm{flex:none;pointer-events:auto;cursor:pointer;background:#fff}
  .tip .logo,.tip .ph{width:44px;height:44px}
  .tip .nm{width:128px;font-size:20px;line-height:44px}
  .tip .val{font-size:26px;line-height:44px;margin-left:10px;width:86px;background:#fff}
  .tip .rank{width:40px;height:40px;line-height:40px;font-size:19px;margin-left:8px;flex:none}
  #read{position:absolute;left:176px;bottom:206px;display:none;align-items:center;gap:12px;background:#fff;padding:2px 12px 2px 0;line-height:44px;pointer-events:none}
  #read .name{font-size:28px}#read .val{font-size:28px}
</style></head>
<body>
<h1>The hardest colleges<br>to <em>get into</em></h1>
<svg id="svg" viewBox="0 0 1080 1350"><defs><clipPath id="plot"><rect id="plotr"/></clipPath></defs><g id="grid"></g><g id="lines" clip-path="url(#plot)"></g><g id="lead"></g><line id="hair" stroke="#0F0F10" stroke-width="1.5"/></svg>
<div id="scrub" data-own></div>
<div id="now"></div>
<div id="tips"></div>
<div id="read"></div>
<p class="src" id="src"></p>
<script src="data.js"></script>
<script src="base.js"></script>
<script>
/* Time is the x axis, fall 2014 to fall 2023. The y axis is the share admitted and it runs upside down: 0% at the top, 12% at the bottom,
   so a school that gets harder to get into climbs. Each school is a black line that draws left to right with its mark at the tip;
   the ten lowest rates at that moment are black and carry their figure, the others are grey. A rate above 12% is below the chart: its line comes in from the bottom edge. */
const HOLD0 = 0.8, PER = 1.0, SETTLE = 0.7, HOLD1 = 2.5, RESET = 0.7;
const T1 = HOLD0 + NY * PER, T2 = T1 + SETTLE, T3 = T2 + HOLD1;
window.DURATION = T3 + RESET; window.FINAL = T2 + 1; window.TRAVEL = [HOLD0, T1, PER];
const X0 = 168, YT = 322, YB = 1130, VMAX = 12, GAP = 46;
const NS = 'http://www.w3.org/2000/svg';
const sv = (parent, tag, at, txt) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (txt != null) e.textContent = txt; parent.appendChild(e); return e; };
const smooth = p => p * p * (3 - 2 * p);
(async () => {
  lelandMark();
  const $ = id => document.getElementById(id), years = []; for (let y = YA; y <= Y1; y++) years.push(y);
  const order = years.map(y => ranking(y)), inTop = (k, i) => order[i].indexOf(k) < 10;
  const USE = marksOk(KEYS), XR = USE ? 778 : 700;                 /* marks for every school, or every school named in type */
  const xOf = f => X0 + f / NY * (XR - X0), yOf = v => YT + v / VMAX * (YB - YT);
  /* positions use admitted / applied itself; the figure shown is the file's rate, to two decimals */
  const V = {}, SHOWN = {}; KEYS.forEach(k => { V[k] = years.map(y => R(k, y).admitted / R(k, y).applied * 100); SHOWN[k] = years.map(y => R(k, y).rate); });
  $('plotr').setAttribute('x', 0); $('plotr').setAttribute('y', YT - 6); $('plotr').setAttribute('width', 1080); $('plotr').setAttribute('height', YB - YT + 6);
  for (let g = 0; g <= VMAX; g += 2) { sv($('grid'), 'line', { x1: 160, x2: 1000, y1: yOf(g), y2: yOf(g), stroke: '#ECECED', 'stroke-width': 2 }); sv($('grid'), 'text', { x: 80, y: yOf(g) + 6, class: 'ax' }, g + '%'); }
  sv($('grid'), 'text', { x: 80, y: YT - 24, class: 'axn' }, 'harder to get into ↑');
  const yl = years.map((y, i) => sv($('grid'), 'text', { x: xOf(i), y: YB + 34, class: 'ax', 'text-anchor': 'middle' }, String(y)));
  $('src').textContent = SRC_LINE + ' Fall 2014 to fall 2023.';
  const O = {};
  KEYS.forEach(k => {
    const line = sv($('lines'), 'polyline', { fill: 'none', 'stroke-linecap': 'butt', 'stroke-linejoin': 'miter', 'stroke-miterlimit': 3 });
    const lead = sv($('lead'), 'line', { stroke: INK_BAR, 'stroke-width': 1.5 });
    const tip = el('div', 'tip'), logo = markEl(k, USE); logo.dataset.tap = k; tip.appendChild(logo);
    const val = el('div', 'val'); tip.appendChild(val); const rank = el('div', 'rank'); tip.appendChild(rank);
    $('tips').appendChild(tip); O[k] = { line, lead, tip, val, rank, logo };
  });
  const finalRank = order[NY], lines = $('lines');
  let hi = null, F = 0;
  function draw(f, fin, alpha) {
    F = f = Math.max(0, Math.min(NY, f)); const i = Math.min(NY - 1, Math.floor(f)), p = f - i, x = xOf(f);
    const st = KEYS.map(k => { const v = V[k][i] + (V[k][i + 1] - V[k][i]) * p, w = +inTop(k, i) + (+inTop(k, i + 1) - +inTop(k, i)) * smooth(p); return { k, v, w, y: yOf(v) }; });
    /* labels never overlap: sorted by height, pushed apart by the least total movement, 46px between neighbours that are both showing */
    const L = st.filter(s => s.w > .01).sort((a, b) => a.y - b.y); let off = 0; const z = L.map((s, j) => { if (j) off += GAP * Math.min(1, 2 * Math.min(s.w, L[j - 1].w)); s.off = off; return s.y - off; });
    const blocks = []; z.forEach(v => { blocks.push({ s: v, n: 1 }); while (blocks.length > 1 && blocks[blocks.length - 2].s / blocks[blocks.length - 2].n > blocks[blocks.length - 1].s / blocks[blocks.length - 1].n) { const b = blocks.pop(); blocks[blocks.length - 1].s += b.s; blocks[blocks.length - 1].n += b.n; } });
    let j = 0; blocks.forEach(b => { for (let n = 0; n < b.n; n++, j++) L[j].ly = b.s / b.n + L[j].off; });
    if (L.length) { const up = Math.max(0, (YT + 20) - L[0].ly); L.forEach(s => s.ly += up); const low = Math.max(0, L[L.length - 1].ly + 22 - (YB + 4)); L.forEach(s => s.ly -= low); }   /* keep the stack inside the chart */
    st.forEach(s => {
      const o = O[s.k], pts = []; for (let q = 0; q <= i; q++) pts.push(xOf(q).toFixed(1) + ',' + yOf(V[s.k][q]).toFixed(1)); pts.push(x.toFixed(1) + ',' + s.y.toFixed(1));
      const dim = hi && hi !== s.k, w = dim ? 0 : hi === s.k ? 1 : s.w;
      o.line.setAttribute('points', pts.join(' ')); o.line.setAttribute('stroke', mix(hex(GREY_BAR), hex(INK_BAR), w)); o.line.setAttribute('stroke-width', (3 + 1.5 * w + (hi === s.k ? 1.5 : 0)).toFixed(2)); o.line.style.opacity = alpha;
      const off = s.v > VMAX + .2, show = (s.w > .01 || hi === s.k) && !off, ly = s.ly != null ? s.ly : s.y, a = alpha * (hi === s.k ? 1 : s.w) * (dim ? .25 : 1);
      o.tip.style.opacity = show ? a.toFixed(3) : 0; o.tip.style.visibility = show ? '' : 'hidden';
      o.tip.style.transform = `translate(${(x + 18).toFixed(1)}px,${(ly - 22).toFixed(1)}px)`; o.tip.style.zIndex = Math.round(100 + s.w * 10);
      o.lead.setAttribute('x1', x); o.lead.setAttribute('y1', s.y); o.lead.setAttribute('x2', x + 18); o.lead.setAttribute('y2', ly); o.lead.style.opacity = show && Math.abs(ly - s.y) > 1.5 ? a.toFixed(3) : 0;
      o.val.textContent = p === 0 ? pc(SHOWN[s.k][i]) : f === NY ? pc(SHOWN[s.k][NY]) : pc(s.v); o.val.style.color = greenText(rateT(s.v)); o.val.dataset.k = p === 0 || f === NY ? `${s.k}.${YA + Math.round(f)}.rate` : '';
      const r = finalRank.indexOf(s.k), e = EASE((fin * SETTLE - r * .04) / .35); o.rank.textContent = r + 1; o.rank.style.opacity = r < 10 ? e : 0; o.rank.style.transform = `scale(${(.6 + .4 * e).toFixed(3)})`; o.rank.style.visibility = fin > 0 && r < 10 ? '' : 'hidden';
    });
    if (hi && lines.lastChild !== O[hi].line) lines.appendChild(O[hi].line);
    const yr = YA + Math.round(f); $('now').textContent = 'Fall ' + yr; $('now').style.left = x + 'px'; $('now').style.opacity = alpha;
    $('hair').setAttribute('x1', x); $('hair').setAttribute('x2', x); $('hair').setAttribute('y1', YT - 46); $('hair').setAttribute('y2', YB); $('hair').style.opacity = .35 * alpha;
    yl.forEach((t, q) => t.style.fill = q === Math.round(f) ? '#010101' : '');
    const rd = $('read'); if (hi) { const s = st.find(s => s.k === hi); rd.style.display = 'flex'; rd.innerHTML = ''; rd.appendChild(el('span', 'name', S[hi].name)); const v = el('span', 'val', p === 0 ? pc(SHOWN[hi][i]) : f === NY ? pc(SHOWN[hi][NY]) : pc(s.v)); v.style.color = greenText(rateT(s.v)); rd.appendChild(v); } else rd.style.display = 'none';
    window.STATE = { f, year: yr, top: L.filter(s => s.w > .5).map(s => s.k) };
  }
  window.seek = t => {
    t = ((t % DURATION) + DURATION) % DURATION;
    const u = Math.max(0, Math.min(1, (t - HOLD0) / (NY * PER))), f = NY * (.8 * u + .2 * smooth(u));
    const fin = Math.max(0, Math.min(1, (t - T1) / SETTLE));
    const alpha = t > T3 ? 1 - smooth(Math.min(1, (t - T3) / (RESET * .6))) : t < .35 ? smooth(t / .35) : 1;
    draw(t > T3 ? NY : f, t > T3 ? 1 : fin, alpha);
  };
  /* drag on the chart to move through the years (letting go settles on the nearest fall); tap a mark to follow one school */
  const sc = $('scrub'); let down = false;
  const scrubTo = e => { Player.stop(); const f = Math.max(0, Math.min(NY, (e.clientX - X0) / (XR - X0) * NY)); draw(f, f >= NY ? 1 : 0, 1); post({ type: 'scrub', year: window.STATE.year }); };
  sc.addEventListener('pointerdown', e => { down = true; sc.setPointerCapture(e.pointerId); scrubTo(e); });
  sc.addEventListener('pointermove', e => { if (down) scrubTo(e); });
  const drop = () => { if (!down) return; down = false; const f = Math.round(F); draw(f, f >= NY ? 1 : 0, 1); post({ type: 'scrub', year: window.STATE.year }); };
  sc.addEventListener('pointerup', drop); sc.addEventListener('pointercancel', drop);
  KEYS.forEach(k => O[k].logo.addEventListener('click', () => { hi = hi === k ? null : k; Player.stop(); draw(F, F >= NY ? 1 : 0, 1); post({ type: 'highlight', school: hi }); }));
  window.scrubYear = f => { Player.stop(); draw(f, f >= NY ? 1 : 0, 1); };
  window.seek(new URLSearchParams(location.search).has('final') || REDUCED ? window.FINAL : 0);
  await ready();
  if (new URLSearchParams(location.search).has('play')) Player.play();
})();
</script>
</body></html>
