<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 6: applied and admitted, fall 2023</title>
<link rel="stylesheet" href="base.css">
<style>
  h1{font-size:62px}
  .hd{position:absolute;top:300px}
  .sw{display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-1px}
  .chart{position:absolute;left:var(--m);right:var(--m);top:340px}
  .r{position:relative;height:172px}
  .r .logo,.r .ph{position:absolute;left:0;top:50px}
  .r .name{position:absolute;left:76px;top:50px;line-height:56px;font-size:32px}
  .r.t .name{left:0}
  .r .sq{position:absolute;left:330px;bottom:14px;background:#C9CACD}
  .r .in{position:absolute;left:0;bottom:0;background:#0F0F10}
  .r .n{position:absolute;left:520px;font-size:30px;line-height:36px}
  .r .n .u{font-family:'Macan',sans-serif;font-weight:400;color:var(--slate);margin-left:10px}
  .r .n0{top:44px}.r .n1{top:86px}
  .r .hair{position:absolute;left:0;right:0;bottom:0;height:2px}
</style></head>
<body>
<h1>In fall 2023 Harvard admitted<br><em>1,965 of 56,937</em> applicants</h1>
<div class="hd" style="left:410px"><span class="sw" style="background:#C9CACD"></span>Applied</div><div class="hd" style="left:540px"><span class="sw" style="background:#0F0F10"></span>Admitted</div>
<div class="chart" id="chart"></div>
<p class="src" id="src"></p>
<script src="data.js"></script>
<script src="base.js"></script>
<script>
/* The five lowest rates of fall 2023. Each grey square's area is the number who applied; the black square inside it, drawn to the same scale, is the number admitted. */
const SIDE = 144;      /* side of the square for the largest applicant count; every other side is SIDE x the square root of its share of that */
(async () => {
  lelandMark();
  const top = ranking(2023).slice(0, 5), c = document.getElementById('chart'), max = Math.max(...top.map(k => R(k, 2023).applied)), USE = marksOk(top), T = scaleT(top.map(k => -R(k, 2023).admitted / R(k, 2023).applied));
  top.forEach(k => {
    const d = R(k, 2023), s = SIDE * Math.sqrt(d.applied / max), i = SIDE * Math.sqrt(d.admitted / max), r = el('div', 'r' + (USE ? '' : ' t')); r.dataset.school = k;
    if (USE) r.appendChild(logoEl(k)); r.appendChild(el('div', 'name', S[k].short));
    const q = el('div', 'sq'); q.style.width = q.style.height = s.toFixed(2) + 'px'; const n = el('div', 'in'); n.style.width = n.style.height = i.toFixed(2) + 'px'; q.appendChild(n); r.appendChild(q);
    r.appendChild(el('div', 'n n0', `<span class="fig" data-k="${k}.2023.applied">${commas(d.applied)}</span><span class="u">applied</span>`));
    r.appendChild(el('div', 'n n1', `<span class="val" data-k="${k}.2023.admitted" style="color:${greenText(T(-d.admitted / d.applied))}">${commas(d.admitted)}</span><span class="u">admitted</span>`));
    r.appendChild(el('div', 'hair')); c.appendChild(r);
  });
  document.getElementById('src').textContent = SRC_LINE + ' Fall 2023.';
  isolate([...c.children]);
  await ready();
})();
</script>
</body></html>
