<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 1: the question (video and final still)</title>
<link rel="stylesheet" href="base.css">
<style>
  .q{position:absolute;left:var(--m);top:330px;width:920px;font-family:'Season',serif;font-weight:500;font-size:138px;line-height:1.02;letter-spacing:-.025em;color:var(--ink)}
  .q em{font-style:normal;color:var(--blue)}
  .mw{display:inline-block;will-change:transform,opacity,filter}
  .marks{position:absolute;left:var(--m);top:880px;width:920px;height:96px}
  .marks .logo,.marks .ph{position:absolute;top:0;width:96px;height:96px;will-change:transform,opacity}
</style></head>
<body>
<p class="q" id="q"></p>
<div class="marks" id="marks"></div>
<script src="data.js"></script>
<script src="base.js"></script>
<script>
/* The founder's line, verbatim. Brackets mark the blue phrase; / is a line break. */
const LINE = 'What does it / take to get / an [MBA]?';
/* Timing: the words arrive at speaking pace, then the seven marks join the row one at a time, hold, and the tile clears so the loop has no cut. */
const T0 = 0.4, WORD_GAP = 0.27, WORD = 0.42, BEAT = 0.35, MARK_GAP = 0.26, MARK = 0.5, HOLD = 2.0, CLEAR = 0.5;
(async () => {
  lelandMark();
  const q = document.getElementById('q');
  q.innerHTML = LINE.split(' / ').map(l => l.split(' ').map(w => { const m = w.match(/^\[(.+)\](.*)$/); return `<span class="mw">${m ? `<em>${m[1]}</em>${m[2]}` : w}</span>`; }).join(' ')).join('<br>');
  const words = [...q.querySelectorAll('.mw')], row = document.getElementById('marks');
  const marks = ORDER.map((k, i) => { const im = logoEl(k); im.dataset.school = k; im.style.left = (i * (920 - 96) / (ORDER.length - 1)) + 'px'; row.appendChild(im); return im; });
  const tMarks = T0 + (words.length - 1) * WORD_GAP + WORD + BEAT, tDone = tMarks + (marks.length - 1) * MARK_GAP + MARK;
  window.DURATION = +(tDone + HOLD + CLEAR).toFixed(2); window.FINAL = tDone + 0.8; window.STATE = { t: 0 };
  window.FILM = [0.55, T0 + 3 * WORD_GAP + .2, T0 + 6 * WORD_GAP + .2, tMarks - .05, tMarks + 1.5 * MARK_GAP + .2, tMarks + 4 * MARK_GAP + .2, window.FINAL, tDone + HOLD + CLEAR * .55];
  let ISO = null;   /* the mark under the pointer; the others fade back */
  window.seek = t => {
    t = ((t % DURATION) + DURATION) % DURATION; window.STATE.t = t;
    const out = Math.max(0, Math.min(1, (t - (tDone + HOLD)) / CLEAR)), all = 1 - out;   /* the whole tile clears at the end of the loop */
    words.forEach((e, i) => { const p = Math.max(0, Math.min(1, (t - T0 - i * WORD_GAP) / WORD)), k = EASE(p); e.style.opacity = (Math.min(1, p * 1.6) * all).toFixed(3); e.style.transform = `translateY(${(.22 * (1 - k)).toFixed(4)}em)`; e.style.filter = p < 1 ? `blur(${(8 * (1 - p)).toFixed(2)}px)` : 'none'; });
    marks.forEach((e, i) => { const p = Math.max(0, Math.min(1, (t - tMarks - i * MARK_GAP) / MARK)), k = EASE(p); e.style.opacity = (Math.min(1, p * 1.6) * all * (ISO && e !== ISO ? .22 : 1)).toFixed(3); e.style.transform = `translateY(${(22 * (1 - k)).toFixed(2)}px)`; });
  };
  isolate(marks, on => { ISO = on; window.seek(window.STATE.t); });
  window.seek(new URLSearchParams(location.search).has('final') || REDUCED ? window.FINAL : 0);
  await ready();
  if (new URLSearchParams(location.search).has('play')) Player.play();
})();
</script>
</body></html>
