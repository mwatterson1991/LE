<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 2: GMAT Focus by school</title>
<link rel="stylesheet" href="base.css">
<style>
  .unit{position:absolute;width:190px;text-align:center}
  .unit .logo,.unit .ph{width:108px;height:108px;margin:0 auto}
  .unit .name{font-size:28px;line-height:1;margin-top:16px}
  .unit .sub{margin-top:7px}
  .score{font-weight:700;font-size:44px;line-height:1;text-align:center;width:160px}
  .minor{text-align:center;width:160px}
  .note .fig{font-weight:700;font-size:30px;line-height:1}
  .note .sub{margin-top:8px;white-space:normal;line-height:1.25}
</style></head>
<body>
<h1>The GMAT Focus scores of<br>the <em>latest MBA classes</em></h1>
<div class="chart" id="c"></div>
<p class="src" id="src"></p>
<script src="data.js"></script>
<script src="base.js"></script>
<script>
/* One axis, 675 to 695. Each school's mark sits above its score; schools with the same score stack. Under each name: whether the school reports a median or an average. */
const AX = 1052, X0 = 172, PER = 36.8, UNIT = 200;      /* axis height; x of 675; pixels per point; height of one stacked school */
const x = v => X0 + (v - 675) * PER;
(async () => {
  lelandMark();
  const c = document.getElementById('c'), keys = ORDER.filter(k => !held(k + '.gmat_focus')), T = scaleT(keys.map(k => S[k].gmat_focus.value));
  put(c, 'div', 'ink', '', { left: X0 - 92, top: AX, width: (695 - 675) * PER + 184, height: 3 });
  const stack = {}, units = [];
  /* within a stack the school listed first in the file sits on top */
  keys.slice().reverse().forEach(k => {
    const g = S[k].gmat_focus, n = stack[g.value] = (stack[g.value] || 0) + 1;
    const u = put(c, 'div', 'unit', '', { left: x(g.value) - 95, top: AX - 26 - n * UNIT + 14 }); u.dataset.school = k;
    u.appendChild(logoEl(k)); u.appendChild(el('div', 'name', S[k].name)); u.appendChild(el('div', 'sub', g.stat)); units.push(u);
    u.dataset.stat = g.stat;
  });
  for (let v = 675; v <= 695; v += 5) {
    put(c, 'div', 'ink', '', { left: x(v) - 1.5, top: AX, width: 3, height: 14 });
    if (stack[v]) { const s = put(c, 'div', 'val score', String(v), { left: x(v) - 80, top: AX + 30, color: greenText(T(v)) }); s.dataset.k = 'gmat_focus.' + v; s.dataset.at = v; units.push(s); }
    else put(c, 'div', 'tick minor', String(v), { left: x(v) - 80, top: AX + 42 }).dataset.k = 'axis.' + v;
  }
  /* Harvard, the top of the middle stack: two facts from its class profile, set either side of its mark */
  const h = S.harvard, hy = AX - 26 - stack[h.gmat_focus.value] * UNIT + 14;
  const a = put(c, 'div', 'note', `<div class="fig"><span data-k="harvard.gmat_focus.mid80">${h.gmat_focus.mid80.join('–')}</span></div><div class="sub">middle 80%<br>at Harvard</div>`, { right: 1080 - (x(685) - 146), top: hy + 14, textAlign: 'right' });
  put(c, 'div', 'ink', '', { left: x(685) - 130, top: hy + 28, width: 56, height: 3 });
  const b = put(c, 'div', 'note', `<div class="fig"><span data-k="harvard.gre_share">${h.gre_share}%</span></div><div class="sub">of Harvard's class<br>sent a GRE score</div>`, { left: x(685) + 146, top: hy + 14 });
  put(c, 'div', 'ink', '', { left: x(685) + 74, top: hy + 28, width: 56, height: 3 });
  a.dataset.school = b.dataset.school = 'harvard';
  document.getElementById('src').textContent = F.sources.profiles + ` GMAT Focus scale: ${F.gmat_focus_scale.join('–')}.` + (held('booth.gmat_focus') ? ' Chicago Booth is not shown.' : '');
  /* hover or tap a school: the others fade, and so do the scores that are not its own */
  const items = units.filter(u => u.dataset.school).concat([a, b]);
  isolate(items, on => units.filter(u => u.dataset.at).forEach(s => { s.style.transition = 'opacity .2s'; s.style.opacity = !on || +s.dataset.at === S[on.dataset.school].gmat_focus.value ? 1 : .22; }));
  await ready();
})();
</script>
</body></html>
