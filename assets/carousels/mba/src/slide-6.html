<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 6: acceptance rate by school</title>
<link rel="stylesheet" href="base.css">
<style>
  .src{width:600px}
  .row{position:absolute;left:var(--m);width:920px;height:112px}
  .row .rank{position:absolute;left:0;top:18px}
  .row .logo,.row .ph{position:absolute;left:72px;top:16px}
  .row .name{position:absolute;left:148px;top:0;line-height:86px;font-size:30px}
  .row .n{position:absolute;top:0;line-height:86px;font-size:26px;text-align:right;width:140px}
  .row .val{position:absolute;right:0;top:0;line-height:86px;font-size:40px}
  .row .line{position:absolute;left:148px;right:0;bottom:6px;height:2px}
  .row .bar{position:absolute;left:148px;bottom:2px;height:10px;background:#0F0F10}
</style></head>
<body>
<h1>The <em>acceptance rates</em> for<br>the MBA Class of 2027</h1>
<div class="chart" id="c"></div>
<p class="src" id="src"></p>
<script src="data.js"></script>
<script src="base.js"></script>
<script>
/* Ranked rows, lowest acceptance rate first. Bar length: rate / 30% of the full width. The Leland lockup closes the carousel, bottom right; this slide has no mark at the top. */
const TOP = 372, ROW = 112, BARMAX = 30, AP = 620, EN = 770;   /* right edges of the two count columns */
(async () => {
  const c = document.getElementById('c'), keys = ORDER.slice().sort((a, b) => +S[a].admit.rate - +S[b].admit.rate), T = scaleT(keys.map(k => +S[k].admit.rate));
  put(c, 'div', 'hd', 'Applications', { right: 1080 - AP, top: TOP - 30 }); put(c, 'div', 'hd', 'Enrolled', { right: 1080 - EN, top: TOP - 30 }); put(c, 'div', 'hd', 'Admitted', { right: 80, top: TOP - 30 });
  const rows = keys.map((k, i) => {
    const a = S[k].admit, r = put(c, 'div', 'row', '', { top: TOP + i * ROW }); r.dataset.school = k;
    r.appendChild(el('div', 'rank', String(i + 1))); r.appendChild(logoEl(k)); r.appendChild(el('div', 'name', S[k].name));
    const n1 = el('div', 'fig n', commas(a.applications)); n1.style.right = (1000 - AP) + 'px'; n1.dataset.k = k + '.admit.applications'; r.appendChild(n1);
    const n2 = el('div', 'fig n', commas(a.enrolled)); n2.style.right = (1000 - EN) + 'px'; n2.dataset.k = k + '.admit.enrolled'; r.appendChild(n2);
    const v = el('div', 'val', a.rate + '%'); v.style.color = greenText(T(+a.rate)); v.dataset.k = k + '.admit.rate'; r.appendChild(v);
    r.appendChild(el('div', 'line hair')); const b = el('div', 'bar'); b.style.width = (Math.min(1, +a.rate / BARMAX) * (920 - 148)).toFixed(1) + 'px'; r.appendChild(b); return r;
  });
  const lock = new Image(); lock.className = 'lock'; lock.alt = 'Leland'; lock.src = 'vendor/logo.svg'; document.body.appendChild(lock);
  document.getElementById('src').textContent = F.sources.admit;
  isolate(rows);
  await ready();
})();
</script>
</body></html>
