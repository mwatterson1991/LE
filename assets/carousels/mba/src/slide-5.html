<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 5: essays and recommendations by school</title>
<link rel="stylesheet" href="base.css">
<style>
  .row{position:absolute;left:var(--m);width:920px;height:114px}
  .row .logo,.row .ph{position:absolute;left:0;top:24px}
  .row .name{position:absolute;left:78px;top:38px;font-size:30px;line-height:1}
  .row .line{position:absolute;left:0;right:0;bottom:0;height:2px}
  .cell{position:absolute;top:24px}
  .cell .top{display:flex;align-items:center;height:34px}
  .sq{width:20px;height:20px;background:#0F0F10;margin-right:7px;flex:none}
  .sq.was{background:none;border:3px solid #0F0F10}
  .cell .val{font-size:34px;line-height:1;margin-left:9px}
  .cell .u{font-family:'Macan',sans-serif;font-weight:500;font-size:25px;line-height:1;margin-left:10px;white-space:nowrap}
  .cell .sub{margin-top:9px}
  .key{display:flex;align-items:center}.key .sq{width:16px;height:16px;border-width:2.5px}
</style></head>
<body>
<h1>The <em>essays and recommendations</em><br>each school asks for</h1>
<div class="chart" id="c"></div>
<p class="src" id="src"></p>
<script src="data.js"></script>
<script src="base.js"></script>
<script>
/* A table in the file's order. One square per piece asked for; an outlined square is a recommendation the school dropped this cycle. */
const TOP = 372, ROW = 114, EX = 400, RX = 800;
(async () => {
  lelandMark();
  const c = document.getElementById('c'), TE = scaleT([1, 4]), TR = scaleT([1, 2]);
  put(c, 'div', 'hd', 'Required essays', { left: EX, top: TOP - 35 }); put(c, 'div', 'hd', 'Recommendations', { right: 80, top: TOP - 35 });
  put(c, 'div', 'hair', '', { left: 80, top: TOP - 2, width: 920, height: 2 });
  const sq = (n, cls) => Array.from({ length: n }, () => `<span class="sq ${cls || ''}"></span>`).join('');
  const rows = ORDER.map((k, i) => {
    const r = put(c, 'div', 'row', '', { top: TOP + i * ROW }), e = held(k + '.essays') ? null : S[k].essays, rc = S[k].recs; r.dataset.school = k;
    r.appendChild(logoEl(k)); r.appendChild(el('div', 'name', S[k].name));
    const ec = el('div', 'cell'); ec.style.left = (EX - 80) + 'px';
    if (e) {
      const detail = (e.words ? `<span data-k="${k}.essays.words">${e.words.length === 2 ? e.words.join(' and ') : e.words.join(', ')}</span> words` : `<span data-k="${k}.essays.chars">${e.chars_each}</span> characters each`)
        + (e.plus ? `, plus <span data-k="${k}.essays.plus">${e.plus.count}</span> ${e.plus.unit}` : '');
      ec.innerHTML = `<div class="top">${sq(e.count)}<span class="val" data-k="${k}.essays" style="color:${greenText(TE(e.count))}">${e.count}</span><span class="u">${e.unit}</span></div><div class="sub">${detail}</div>`;
    } else ec.innerHTML = `<div class="sub" style="margin-top:17px">not shown: sources differ</div>`;
    r.appendChild(ec);
    const rcell = el('div', 'cell'); rcell.style.right = '0';
    rcell.innerHTML = `<div class="top" style="justify-content:flex-end">${sq(rc.count)}${rc.was ? sq(rc.was - rc.count, 'was') : ''}<span class="val" data-k="${k}.recs" style="color:${greenText(TR(rc.count))};width:28px;text-align:right">${rc.count}</span></div>`;
    r.appendChild(rcell);
    r.appendChild(el('div', 'line hair')); return r;
  });
  const was = [...new Set(ORDER.filter(k => S[k].recs.was).map(k => S[k].recs.was))];
  put(c, 'div', 'sub key', `<span class="sq was"></span><span>dropped this cycle (was <span data-k="recs.was">${was.join(', ')}</span>)</span>`, { right: 80, top: TOP + ORDER.length * ROW + 18 });
  document.getElementById('src').textContent = F.sources.req;
  isolate(rows);
  await ready();
})();
</script>
</body></html>
