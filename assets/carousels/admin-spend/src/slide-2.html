<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 2: the FY 2024 ranking (and, with seek, the reordering list animation)</title>
<link rel="stylesheet" href="base.css">
<style>
  h1{font-size:68px}
  .fy{position:absolute;right:var(--m);top:240px;font-family:var(--helv);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
  .list{position:absolute;left:var(--m);right:var(--m);top:346px;height:850px;overflow:hidden}
  .slot{position:absolute;left:0;top:0}
  .row{position:absolute;left:72px;right:0;top:0;height:85px;background:#fff;will-change:transform}
  .row .logo,.row .ph{position:absolute;left:0;top:14px}
  .row .name{position:absolute;left:76px;top:0;line-height:80px;font-size:33px}
  .row .val{position:absolute;right:0;top:0;line-height:80px;font-size:37px}
  .row .hair{position:absolute;left:76px;right:0;bottom:3px;height:2px;background:var(--hair)}
  .row .bar{position:absolute;left:76px;bottom:-1px;height:10px;border-radius:0;background:#0F0F10}
  /* ?anim only (slide-1-list.mp4): a larger year, and a track of the eight years across the top of the list with the current one marked */
  body.anim .fy{font-size:60px;top:226px}
  body.anim .list{top:384px;height:810px}
  body.anim .row{height:81px}
  body.anim .row .logo,body.anim .row .ph{top:12px}
  body.anim .row .name,body.anim .row .val{line-height:76px}
  #track{position:absolute;left:var(--m);right:var(--m);top:318px;height:50px;display:none}
  body.anim #track{display:block}
  #track .base{position:absolute;left:0;right:0;top:6px;height:2px;background:var(--hair)}
  #track .done{position:absolute;left:0;top:5px;height:4px;background:#0F0F10}
  #track .knob{position:absolute;top:0;width:14px;height:14px;margin-left:-7px;background:#0F0F10}
  #track .yr{position:absolute;top:24px;width:80px;margin-left:-40px;text-align:center;font-family:var(--helv);font-size:19px;line-height:1;color:var(--grey);font-variant-numeric:tabular-nums}
  #track .yr:first-of-type{text-align:left;margin-left:0}#track .yr:last-of-type{text-align:right;margin-left:-80px}
  #track .yr.on{color:#010101;font-weight:700}
</style></head>
<body>
<h1>The colleges that spend<br>the most on <em>administration</em><br>per student</h1>
<div class="fy" id="fy"></div>
<div id="track"><div class="base"></div><div class="done"></div><div class="knob"></div></div>
<div class="list" id="list"></div>
<p class="src" id="src"></p>
<script src="data.js"></script>
<script src="base.js"></script>
<script>
/* Timeline: hold on FY 2017, travel a year at a time to FY 2024, hold, then run back to the start so the loop has no cut. */
const YA = 2017;   /* first year shown: FY 2017 to FY 2024 are the years checked against every large US institution */
const HOLD0 = 1.0, PER = 1.2, HOLD1 = 2.5, BACK = 0.8, NY = Y1 - YA;
window.TRAVEL = [HOLD0, HOLD0 + NY * PER, PER];
window.DURATION = HOLD0 + NY * PER + HOLD1 + BACK;
window.FINAL = HOLD0 + NY * PER + 1.2;         /* a settled FY 2024 frame, used for slide-1.png */
window.ANIM = new URLSearchParams(location.search).has('anim'); if (window.ANIM) document.body.classList.add('anim');
const ROWH = window.ANIM ? 81 : 85, SHOW = 10, BARMAX = 60000;     /* bar length: dollars / 60,000 of the full width, the same at every year */
(async () => {
  lelandMark();
  const S = await loadData(), keys = Object.keys(S), list = document.getElementById('list'), fy = document.getElementById('fy');
  const years = []; for (let y = YA; y <= Y1; y++) years.push(y);
  const rank = {}, val = {};
  years.forEach(y => { const r = ranking(S, y); keys.forEach(k => { (rank[k] = rank[k] || {})[y] = r.indexOf(k); (val[k] = val[k] || {})[y] = S[k].years[y].per_student; }); });
  const slotOf = r => Math.min(r, SHOW);         /* everything outside the top ten waits just below the list */
  const rows = {};
  keys.forEach(k => {
    const r = el('div', 'row'); r.appendChild(logoEl(k));
    r.appendChild(el('div', 'name', S[k].name));
    const v = el('div', 'val'); r.appendChild(v); r.appendChild(el('div', 'hair')); const b = el('div', 'bar'); r.appendChild(b);
    list.appendChild(r); rows[k] = { r, v, b };
  });
  for (let i = 0; i < SHOW; i++) { const c = el('div', 'slot rank', String(i + 1)); c.style.transform = `translateY(${i * ROWH + (window.ANIM ? 12 : 14)}px)`; c.style.zIndex = 500; list.appendChild(c); }
  const barW = list.clientWidth - 72 - 76;
  const track = document.getElementById('track'), TW = 920, yrs = years.map((y, i) => { const e = el('span', 'yr', String(y)); e.style.left = (i / NY * TW) + 'px'; track.appendChild(e); return e; });
  /* state at time t: (from year, to year, eased progress) */
  function at(t) {
    t = ((t % DURATION) + DURATION) % DURATION;
    if (t < HOLD0) return [YA, YA, 1];
    const u = t - HOLD0;
    if (u < NY * PER) { const i = Math.floor(u / PER); return [YA + i, YA + i + 1, EASE((u - i * PER) / PER)]; }
    if (u < NY * PER + HOLD1) return [Y1, Y1, 1];
    return [Y1, YA, EASE((u - NY * PER - HOLD1) / BACK)];
  }
  const SRC = 'Source: NCES IPEDS Finance. Institutional support expenses per full-time-equivalent student. ', src = document.getElementById('src');
  window.seek = t => {
    const [a, b, p] = at(t);
    src.textContent = SRC + (window.ANIM ? 'Fiscal years 2017 to 2024.' : 'Fiscal year 2024.');
    const pos = (a - YA) + (b - a) * p; track.querySelector('.done').style.width = (pos / NY * TW) + 'px'; track.querySelector('.knob').style.left = (pos / NY * TW) + 'px'; yrs.forEach((e, i) => e.classList.toggle('on', i === Math.round(pos)));
    fy.textContent = 'FY ' + (Math.abs(b - a) > 1 ? Math.round(a + (b - a) * p) : (p >= .5 ? b : a));
    keys.forEach(k => {
      const o = rows[k], y = slotOf(rank[k][a]) + (slotOf(rank[k][b]) - slotOf(rank[k][a])) * p, v = val[k][a] + (val[k][b] - val[k][a]) * p;
      o.r.style.transform = `translateY(${(y * ROWH).toFixed(2)}px)`;
      o.r.style.zIndex = 100 - Math.round(Math.min(rank[k][a], rank[k][b]) * 4) + (rank[k][b] < rank[k][a] ? 2 : 0);   /* the row that is rising passes in front */
      o.v.textContent = usd(v); o.v.style.color = greenText(psT(v));
      o.b.style.width = (Math.min(1, v / BARMAX) * barW).toFixed(1) + 'px';
      o.v.dataset.k = p >= 1 ? `${k}.${b}.per_student` : '';
    });
  };
  /* as slide 2 this page is a still of FY 2024. ?anim turns it back into the reordering list (rendered as slide-1-list.mp4). */
  window.seek(window.ANIM ? 0 : window.FINAL);
  isolate(keys.map(k => rows[k].r));
  await ready();
  if (new URLSearchParams(location.search).has('play')) Player.play();
})();
</script>
</body></html>
