<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 2: Stanford, where the money goes</title>
<link rel="stylesheet" href="base.css">
<style>
  .chart{position:absolute;left:var(--m);right:var(--m);top:450px}
  .f{position:relative;height:83px}
  .f .name{position:absolute;left:0;top:0;font-size:30px;line-height:44px;color:var(--slate)}
  .f.on .name{color:var(--ink);font-weight:600}
  .f .val{position:absolute;top:0;font-size:30px;line-height:44px;text-align:right}
  .f .usd{right:150px}.f .pc{right:0}
  .f .bar{position:absolute;left:0;top:48px;height:20px;border-radius:0;background:#C9CACD}
</style></head>
<body>
<span id="subj"></span>
<h1 class="under">Administration was <em>11%</em><br>of Stanford’s $8.4 billion<br>in expenses</h1>
<div class="chart" id="chart"></div>
<p class="src">Source: NCES IPEDS Finance. Total expenses by function, Stanford University, fiscal year 2024.</p>
<script src="base.js"></script>
<script>
const FN = [['instruction', 'Instruction'], ['research', 'Research'], ['public_service', 'Public service'], ['academic_support', 'Academic support'], ['student_services', 'Student services'],
  ['inst_support', 'Administration'], ['auxiliary', 'Auxiliary enterprises'], ['hospital', 'Hospital services'], ['independent_ops', 'Independent operations'], ['net_grant_aid', 'Net grant aid to students']];
const money = v => v >= 1e9 ? '$' + (v / 1e9).toFixed(2) + ' billion' : '$' + Math.round(v / 1e6) + ' million';
(async () => {
  lelandMark();
  const S = await loadData(), r = S.stanford.years[2024], tot = r.total_expenses;
  const im = logoEl('stanford', 'subject'); document.getElementById('subj').replaceWith(im);
  const rows = FN.filter(f => r[f[0]] != null).map(f => ({ k: f[0], name: f[1], v: r[f[0]] })).sort((a, b) => b.v - a.v);
  const max = rows[0].v, min = rows[rows.length - 1].v, W = 920, c = document.getElementById('chart');
  rows.forEach(o => {
    const t = (o.v - min) / (max - min), d = el('div', 'f' + (o.k === 'inst_support' ? ' on' : ''));
    d.appendChild(el('div', 'name', o.name));
    const a = el('div', 'val usd', money(o.v)); a.style.color = greenText(t); a.dataset.k = 'stanford.2024.' + o.k + '.money'; d.appendChild(a);
    const p = el('div', 'val pc', pct(o.v / tot, 1)); p.style.color = greenText(t); p.dataset.k = 'stanford.2024.' + o.k + '.share1'; d.appendChild(p);
    const b = el('div', 'bar'); b.style.width = (o.v / max * W).toFixed(1) + 'px'; if (o.k === 'inst_support') b.style.background = INK_BAR; d.appendChild(b);
    c.appendChild(d);
  });
  await ready();
})();
</script>
</body></html>
