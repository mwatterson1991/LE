<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 7: Leland</title>
<link rel="stylesheet" href="base.css">
<style>
  /* the lockup, as on the Motion page (css: .lock, .lmw, .wm), scaled up: mark box S, wordmark height S * 38.6/56 */
  .stage{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .lock{display:flex;align-items:flex-start;height:168px}
  .lmw{position:relative;width:168px;height:168px;flex:none;display:block}
  .lmw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .lmi .ink{fill:#0b0b0b}
  .wm{width:0;height:115.8px;margin-top:17.4px;overflow:hidden}
  .wm svg{height:115.8px;width:auto;max-width:none;fill:#010101;display:block}
  .line{margin-top:64px;width:860px;text-align:center;font-family:'Season',serif;font-weight:500;font-size:60px;line-height:1.08;letter-spacing:-.02em;color:var(--ink)}
  .line em{font-style:normal;color:var(--blue)}
  .mw{display:inline-block;will-change:transform,opacity,filter}
</style></head>
<body>
<div class="stage"><div class="lock"><div class="lmw" id="mark"></div><div class="wm" id="wm"></div></div>
<p class="line" id="line"></p></div>
<script src="vendor/mark.js"></script>   <!-- js/mark.js, copied unchanged by build.py -->
<script src="data.js"></script>
<script src="base.js"></script>
<script>
/* The line is Leland's own figure and is pending sign-off. Brackets mark the blue phrase. */
const LINE = 'Leland MBA customers are admitted to M7 programs at [3x] the national average.';
/* Timings from data/motion-ref.json (logo.leo, text.words, hold.end_card): mark draws on, holds a beat, the wordmark types in while the lockup re-centres, then the line arrives word by word. */
const T_IN = 0.3, DRAW = 0.55, BEAT = 0.25, TYPE = 0.6, GAP = 0.3, WORD = 0.25, STAG = 0.1, HOLD = 2.2;
(async () => {
  const host = document.getElementById('mark'); host.innerHTML = LM_SVG.replace(/__S/g, '_c7'); const api = LelandIntro(host, '_c7', { phase: 'draw' });
  /* the wordmark split into letters so it can type in (same method as js/le.js wordmark()) */
  const t = window.LELAND_LOGO_SVG, d = [...t.matchAll(/<path d="([^"]+)"/g)].map(m => m[1]);
  const NS = 'http://www.w3.org/2000/svg', s = document.createElementNS(NS, 'svg'); s.style.cssText = 'position:absolute;width:0;height:0;visibility:hidden'; document.body.appendChild(s);
  const bb = d[3].split(/(?=M)/).filter(Boolean).map(p => { const e = document.createElementNS(NS, 'path'); e.setAttribute('d', p); s.appendChild(e); const b = e.getBBox(); return { p, x0: b.x, x1: b.x + b.width }; }).sort((a, b) => a.x0 - b.x0); s.remove();
  const L = []; bb.forEach(b => { const c = L[L.length - 1]; if (c && b.x0 < c.x1 - .3) { c.p += b.p; c.x1 = Math.max(c.x1, b.x1); } else L.push({ ...b }); });
  const X0 = L[0].x0, X1 = L[L.length - 1].x1, wm = document.getElementById('wm');
  wm.innerHTML = `<svg viewBox="${X0} 0 ${X1 - X0} 24">${L.map(l => `<path d="${l.p}"/>`).join('')}</svg>`;
  const paths = [...wm.querySelectorAll('path')], u = 115.8 / 24;
  const line = document.getElementById('line');
  line.innerHTML = LINE.split(' ').map(w => { const m = w.match(/^\[(.+)\](.*)$/); return `<span class="mw">${m ? `<em>${m[1]}</em>${m[2]}` : w}</span>`; }).join(' ');
  const words = [...line.children];
  const tType = T_IN + DRAW + BEAT, tLine = tType + TYPE + GAP, tEnd = tLine + (words.length - 1) * STAG + WORD;
  window.DURATION = +(tEnd + HOLD).toFixed(2); window.FINAL = tEnd + 1;
  const d1 = api.T.draw[1] - .5, per = TYPE / L.length;
  window.seek = t => {
    const m = t - T_IN; api.render(m <= 0 ? 0 : m < DRAW ? d1 * m / DRAW : d1 + .2);
    /* letters appear one at a time; the window's width eases to each letter's right edge over .12s, so the lockup re-centres as it types */
    const q = (t - tType) / per; let w = 0;
    paths.forEach((p, i) => { p.style.opacity = q >= i ? 1 : 0; if (q >= i) { const prev = i ? (L[i - 1].x1 - X0) * u : 0, cur = (L[i].x1 - X0) * u; w = prev + (cur - prev) * EASE(((t - tType) - i * per) / .12); } });
    wm.style.width = w.toFixed(2) + 'px';
    words.forEach((e, i) => { const p = Math.max(0, Math.min(1, (t - tLine - i * STAG) / WORD)), k = EASE(p); e.style.opacity = p; e.style.transform = `translateY(${(.3 * (1 - k)).toFixed(4)}em)`; e.style.filter = p < 1 ? `blur(${(6 * (1 - p)).toFixed(2)}px)` : 'none'; });
  };
  window.seek(new URLSearchParams(location.search).has('final') || REDUCED ? window.FINAL : 0);
  await ready();
  if (new URLSearchParams(location.search).has('play')) Player.play();
})();
</script>
</body></html>
