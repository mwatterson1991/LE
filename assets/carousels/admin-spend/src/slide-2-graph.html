<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 2, graph version: the FY 2024 ranking as bars</title>
<link rel="stylesheet" href="base.css">
<style>
  h1{font-size:68px}
  .fy{position:absolute;right:var(--m);top:240px;font-family:var(--helv);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
  .chart{position:absolute;left:var(--m);right:var(--m);top:346px}
  .r{position:relative;height:85px}
  .r .rank{position:absolute;left:0;top:14px}
  .r .bar{position:absolute;left:72px;top:22px;height:36px;background:#0F0F10}
  .r .logo,.r .ph{position:absolute;top:12px}
  .r .val{position:absolute;top:0;line-height:80px;font-size:34px}
</style></head>
<body>
<h1>The colleges that spend<br>the most on <em>administration</em><br>per student</h1>
<div class="fy">FY 2024</div>
<div class="chart" id="chart"></div>
<p class="src">Source: NCES IPEDS Finance. Institutional support expenses per full-time-equivalent student. Fiscal year 2024.</p>
<script src="data.js"></script>
<script src="base.js"></script>
<script>
/* The same ten values as the table version of this slide, drawn as bars from $0. Each school's mark sits at the end of its bar, then its figure. */
const BARW = 560;      /* length of the longest bar; every bar is its value / the largest value of that */
(async () => {
  lelandMark();
  const S = await loadData(), top = ranking(S, 2024).slice(0, 10), c = document.getElementById('chart'), max = S[top[0]].years[2024].per_student;
  top.forEach((k, i) => {
    const v = S[k].years[2024].per_student, w = v / max * BARW, r = el('div', 'r'); r.dataset.school = k;
    r.appendChild(el('div', 'rank', String(i + 1)));
    const b = el('div', 'bar'); b.style.width = w.toFixed(1) + 'px'; r.appendChild(b);
    const l = logoEl(k); l.style.left = (72 + w + 14) + 'px'; r.appendChild(l);
    const t = el('div', 'val', usd(v)); t.style.left = (72 + w + 14 + 56 + 16) + 'px'; t.style.color = greenText(psT(v)); t.dataset.k = `${k}.2024.per_student`; r.appendChild(t);
    c.appendChild(r);
  });
  isolate([...c.children]);
  await ready();
})();
</script>
</body></html>
