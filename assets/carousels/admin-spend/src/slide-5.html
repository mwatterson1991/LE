<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 5: administration and student services</title>
<link rel="stylesheet" href="base.css">
<style>
  .chart{position:absolute;left:var(--m);right:var(--m);top:346px}
  .s{position:relative;height:166px}
  .s .logo,.s .ph{position:absolute;left:0;top:0}
  .s .name{position:absolute;left:76px;top:0;font-size:32px;line-height:56px}
  .s .lab{position:absolute;left:76px;font-size:24px;line-height:28px;color:var(--slate);white-space:nowrap}
  .s .bar{position:absolute;left:290px;height:20px;border-radius:4px}
  .s .val{position:absolute;font-size:30px;line-height:28px}
  .s .ra{top:68px}.s .rb{top:108px}.s .bar.ra{top:72px}.s .bar.rb{top:112px}
</style></head>
<body>
<h1>The top five spent<br><em>more on administration</em><br>than student services</h1>
<div class="chart" id="chart"></div>
<p class="src">Source: NCES IPEDS Finance. Institutional support expenses per full-time-equivalent student. Student services on the same basis. Fiscal year 2024.</p>
<script src="base.js"></script>
<script>
(async () => {
  lelandMark();
  const S = await loadData(), top = ranking(S, 2024).slice(0, 5), c = document.getElementById('chart');
  const BW = 500, max = S[top[0]].years[2024].per_student;       /* the longest bar is the largest value on the slide */
  top.forEach(k => {
    const r = S[k].years[2024], adm = r.per_student, ss = r.student_services / r.fte, d = el('div', 's');
    d.appendChild(logoEl(k)); d.appendChild(el('div', 'name', S[k].name));
    [['ra', 'Administration', adm, 'per_student'], ['rb', 'Student services', ss, 'ss_per_fte']].forEach(([cl, lab, v, key]) => {
      d.appendChild(el('div', 'lab ' + cl, lab));
      const b = el('div', 'bar ' + cl), w = v / max * BW; b.style.width = w.toFixed(1) + 'px'; b.style.background = greenBar(psT(v)); d.appendChild(b);
      const s = el('div', 'val ' + cl, usd(v)); s.style.left = (290 + w + 16).toFixed(1) + 'px'; s.style.color = greenText(psT(v)); s.dataset.k = `${k}.2024.${key}`; d.appendChild(s);
    });
    c.appendChild(d);
  });
  await ready();
})();
</script>
</body></html>
