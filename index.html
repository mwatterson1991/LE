<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LE</title>
<link rel="icon" href="assets/brand/mark.svg">
<link rel="stylesheet" href="css/le.css">
</head>
<body>

<header class="top">
  <a class="logo" href="#make" aria-label="LE"><span class="lmw" id="lemark"></span><span class="le">LE</span></a>
  <div class="search" id="search">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" aria-label="Search" autocomplete="off" spellcheck="false">
    <span class="ph" id="qph" aria-hidden="true"></span>
    <div class="sugg" id="sugg"></div>
  </div>
</header>

<div class="app">
  <nav class="side">
    <a id="s-make" class="on" href="#make">Make</a>
    <a id="s-lib" href="#lib">Library</a>
    <a id="s-projects" href="#projects">Projects</a>
    <a id="s-skill" href="#skill">Skill</a>
    <a id="s-motion" href="#motion">Motion</a>
    <a id="s-brand" href="#brand">Brand</a>
  </nav>

  <div class="main" id="main">

    <section id="make" class="screen on">
      <div class="wrap">
        <h1>What are we making?</h1>
        <div class="picks" id="picks"></div>
      </div>
    </section>

    <section id="pick" class="screen">
      <div class="wrap">
        <div class="ehead"><button class="back" onclick="go('make')"><svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Make</button></div>
        <h1 id="pickTitle"></h1>
        <div id="pickBody"></div>
      </div>
    </section>

    <section id="lib" class="screen">
      <div class="wrap">
        <h1>Library</h1>
        <div class="tabs" id="tabs"></div>
        <div class="subs" id="chips"></div>
        <div id="grid"></div>
      </div>
    </section>

    <section id="editor" class="screen">
      <div class="wrap">
        <div class="ehead">
          <button class="back" id="eback" onclick="go('make')"><svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
          <input class="title" id="etitle" value="Untitled">
          <div class="right"><button class="btn" id="prbtn" onclick="presentCurrent()" style="display:none">Present</button><button class="btn black" id="dlbtn" onclick="exportCurrent()">Download</button></div>
        </div>
        <div class="egrid" id="egrid">
          <div class="estage">
            <div class="stage" id="stage"><img id="canvasImg" alt=""></div>
            <div class="stagebar" id="stagebar"></div>
            <div class="slides" id="slides"></div>
          </div>
          <div class="panel" id="panel"></div>
        </div>
        <div class="drawer" id="drawer">
          <div class="dhead"><div class="tabs" id="dtabs"></div><input id="dq" class="dsearch" aria-label="Search" oninput="renderDrawer()"><button class="btn sm" onclick="closeDrawer()">Done</button></div>
          <div class="grid" id="dgrid"></div>
        </div>
      </div>
    </section>

    <section id="projects" class="screen">
      <div class="wrap">
        <div class="hrow"><h1>Projects</h1><button class="btn black" id="projnew" onclick="go('make')">New</button></div>
        <div id="projlist"></div>
      </div>
    </section>

    <section id="skill" class="screen">
      <div class="wrap text">
        <div class="hrow"><h1>Skill</h1><div class="acts"><a class="link" href="DEVELOPERS.md" download>Developer instructions</a><button class="btn" onclick="downloadSkill()">Download .md</button><button class="btn black" onclick="copyText(SKILL(),'Copied')">Copy</button></div></div>
        <div class="md" id="skillbody"></div>
      </div>
    </section>

    <section id="motion" class="screen">
      <div class="wrap text">
        <h1>Motion</h1>
        <div class="doc" id="motionbody"></div>
      </div>
    </section>

    <section id="brand" class="screen">
      <div class="wrap text">
        <h1>Brand</h1>
        <div class="doc" id="brandbody"></div>
      </div>
    </section>
  </div>
</div>

<div class="pv" id="pv" onclick="if(event.target===this)closePreview()">
  <button class="close" onclick="closePreview()" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="nav prev" onclick="stepPreview(-1)" aria-label="Previous"><svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="nav next" onclick="stepPreview(1)" aria-label="Next"><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="box"><div class="stage" id="pvstage"></div><div class="side2" id="pvside"></div></div>
</div>
<div class="ov" id="ov"><h1>Working on it</h1><p id="ovp"></p></div>
<div class="toast" id="toast"></div>

<script src="js/mark.js"></script>
<script src="js/templates.js"></script>
<script src="js/deck.js"></script>
<script src="js/le.js"></script>
<script src="js/present.js"></script>
</body>
</html>
